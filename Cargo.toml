[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/tamnd/zou"
authors = ["Tam Nguyen <tamnd87@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
crc32c = "0.6"
hmac = "0.13"
libc = "0.2"
lz4_flex = "0.14"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ureq = "3.3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
strip = true
