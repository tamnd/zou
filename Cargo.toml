[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/tamnd/zou"
authors = ["Tam Nguyen <tamnd87@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64ct = { version = "1", features = ["alloc"] }
crc32c = "0.6"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
getrandom = "0.3"
hmac = "0.13"
libc = "0.2"
log = "0.4"
p256 = "0.14"
lz4_flex = "0.14"
memmap2 = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
# The same knobs ureq builds it with, so the two share one build and
# nothing pulls in a second crypto backend.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tower = "0.5"
ureq = "3.3"
webpki-roots = "1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
strip = true
