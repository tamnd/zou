[package]
name = "zou-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zou-store = { path = "../crates/zou-store" }
zou-log = { path = "../crates/zou-log" }
zou-realtime = { path = "../crates/zou-realtime" }
zou-rest = { path = "../crates/zou-rest" }
zou-server = { path = "../crates/zou-server" }
serde_json = "1"

[[bin]]
name = "frame_v2"
path = "fuzz_targets/frame_v2.rs"
