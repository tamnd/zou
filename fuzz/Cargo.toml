[package]
name = "zou-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zou-store = { path = "../crates/zou-store" }
zou-rest = { path = "../crates/zou-rest" }

[[bin]]
name = "wal_decode"
path = "fuzz_targets/wal_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_v2"
path = "fuzz_targets/frame_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rest_filter"
path = "fuzz_targets/rest_filter.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
