[advisories]
version = 2
yanked = "deny"
ignore = [
  # paste is a proc macro reached only through rav1e, which is the avif
  # encoder behind the image transform routes. Its author archived the
  # repository and there is no upgrade, safe or otherwise, so the
  # choices are to carry it or to answer format=avif with nothing.
  #
  # It is a compile time dependency: it expands macros and no part of it
  # is in the binary. Unmaintained is a real thing to know about a crate
  # and it is not a vulnerability, and this one cannot become one at
  # runtime because it is not there at runtime.
  { id = "RUSTSEC-2024-0436", reason = "paste is a build time proc macro under rav1e, archived upstream with no successor in the avif encoder's tree" },
  # Both of these arrive under the javascript engine, which is behind a
  # feature no default build turns on, and neither is a vulnerability.
  #
  # bincode 1.3.3 is what deno_core serialises its snapshots with. Its
  # authors stopped after a harassment incident and said 1.3.3 is a
  # finished version rather than an abandoned one, which is a different
  # thing from code nobody is watching.
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 under deno_core, declared complete by its authors rather than left unfinished" },
  # smartstring is swc's interned string, archived in May 2026. Replacing
  # it is swc's decision and not one this repository can make, and the
  # alternative is having no typescript.
  { id = "RUSTSEC-2026-0249", reason = "smartstring under swc, archived upstream, reached only through the transpiler behind the isolate feature" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # webpki-roots ships the Mozilla CA bundle under CDLA-Permissive-2.0.
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

# NCSA is allowed for this one crate and no other. libfuzzer-sys is
# rav1e's fuzzing harness, behind a feature nothing here turns on: it is
# absent from the build graph entirely and only appears because this
# check is run with --all-features, which reaches features no build
# reaches. Allowing the licence outright would be a claim about every
# future dependency rather than about this one.
[[licenses.exceptions]]
name = "libfuzzer-sys"
allow = ["NCSA"]

# MPL-2.0 for these two and no others, for the same reason. It is a file
# level copyleft: what it asks is that changes to its own files stay
# under it, which is a promise a build that links them unmodified keeps
# by doing nothing. Allowing the licence outright would be a claim about
# every future dependency instead of about these two, and both of them
# are somebody else's choice made deep under the javascript engine.
#
# cooked-waker is deno_core's waker, and smartstring is swc's interned
# string.
[[licenses.exceptions]]
name = "cooked-waker"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "smartstring"
allow = ["MPL-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
