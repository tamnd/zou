name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace

  pg-pool:
    name: sql session pool (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: zou-pool-tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the pool leak, rls contract, rls attack, and auth tests
        env:
          ZOU_PG_TEST_DSN: host=127.0.0.1 port=5432 user=postgres password=zou-pool-tests dbname=postgres
        # Every integration target in this crate, so a suite that needs
        # a database cannot be added without CI noticing it exists. The
        # ones that do not need a database skip themselves.
        run: cargo test -p zou-server --tests -- --nocapture
      - name: Run the compiled WHERE clauses against postgres
        env:
          ZOU_PG_TEST_DSN: host=127.0.0.1 port=5432 user=postgres password=zou-pool-tests dbname=postgres
        run: cargo test -p zou-rest --test pg -- --nocapture

  conformance:
    name: conformance (postgrest)
    runs-on: ubuntu-latest
    # The postgrest suite is 1233 cases asked twice, and on a slow runner
    # the whole job has taken 45 minutes. A number here so that a job
    # which has stopped making progress is killed rather than sitting on
    # the six hour default.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: zou-conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ZOU_CONFORMANCE_DSN: postgres://postgres:zou-conformance@127.0.0.1:5432/postgres
      ZOU_CONFORMANCE_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      ZOU_CONFORMANCE_SUITES: /tmp/zou-conformance/suites
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The questions and the recordings are upstream's data rather than
      # zou's code, so they are a repository of their own, pinned to a
      # commit here. A recording that moved under CI would be a
      # recording nobody is comparing against.
      - name: Fetch the suites
        run: |
          git clone -q https://github.com/tamnd/zou-conformance /tmp/zou-conformance
          git -C /tmp/zou-conformance checkout -q "$(jq -r .ref conformance/suites.json)"
          git -C /tmp/zou-conformance log --oneline -1
      - name: Fetch the PostgREST the suites were recorded from
        run: |
          version=$(jq -r .postgrest.version /tmp/zou-conformance/versions.json)
          asset="postgrest-v$version-linux-static-x86-64.tar.xz"
          curl -sSfL -o /tmp/postgrest.tar.xz \
            "https://github.com/PostgREST/postgrest/releases/download/v$version/$asset"
          tar -xJf /tmp/postgrest.tar.xz -C /tmp
          /tmp/postgrest --version
      - name: Test the harness against the suites it reads
        run: cargo test -p zou-conformance
      # Named rather than left to default, because the default is every
      # suite in the directory and the auth one is compared against a
      # different binary in a job of its own.
      - name: Check zou against the recording
        run: |
          cargo run -p zou-conformance -- check \
            --suite rest --suite postgrest \
            --zou-dsn "$ZOU_CONFORMANCE_DSN" \
            --jwt-secret "$ZOU_CONFORMANCE_SECRET" \
            --json /tmp/conformance.json
      # The recording is the thing every check is measured against, so a
      # release of PostgREST that answers differently has to fail here
      # rather than sit in the file being believed. Same suite, same
      # database, both targets asked in turn.
      #
      # A suite is diffed against a PostgREST configured the way that
      # suite was recorded from, which is why there are two of these and
      # not one: the rest suite keeps its tables in conformance, and the
      # postgrest suite keeps them where upstream's own fixtures do.
      - name: Diff the rest suite against a live PostgREST
        run: |
          cat > /tmp/rest.conf <<CONF
          db-uri = "$ZOU_CONFORMANCE_DSN"
          db-schemas = "conformance,public"
          db-anon-role = "anon"
          jwt-secret = "$ZOU_CONFORMANCE_SECRET"
          server-port = 3999
          db-pool = 4
          CONF
          psql "$ZOU_CONFORMANCE_DSN" -v ON_ERROR_STOP=1 -f /tmp/zou-conformance/suites/rest/setup.sql
          /tmp/postgrest /tmp/rest.conf &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3999/ >/dev/null && break
            sleep 1
          done
          cargo run -p zou-conformance -- diff --suite rest \
            --zou-dsn "$ZOU_CONFORMANCE_DSN" \
            --reference-url http://127.0.0.1:3999 \
            --reference-name "postgrest live" \
            --reference-dsn "$ZOU_CONFORMANCE_DSN" \
            --reference-strip-prefix /rest/v1 \
            --jwt-secret "$ZOU_CONFORMANCE_SECRET"
      - name: Diff the postgrest suite against a live PostgREST
        run: |
          cat > /tmp/upstream.conf <<CONF
          db-uri = "$ZOU_CONFORMANCE_DSN"
          db-schemas = "test"
          db-anon-role = "postgrest_test_anonymous"
          db-extra-search-path = ""
          jwt-secret = "$ZOU_CONFORMANCE_SECRET"
          server-port = 3998
          db-pool = 4
          CONF
          psql "$ZOU_CONFORMANCE_DSN" -v ON_ERROR_STOP=1 -f /tmp/zou-conformance/suites/postgrest/setup.sql
          /tmp/postgrest /tmp/upstream.conf &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3998/ >/dev/null && break
            sleep 1
          done
          cargo run -p zou-conformance -- diff --suite postgrest \
            --zou-dsn "$ZOU_CONFORMANCE_DSN" \
            --reference-url http://127.0.0.1:3998 \
            --reference-name "postgrest live" \
            --reference-dsn "$ZOU_CONFORMANCE_DSN" \
            --reference-strip-prefix /rest/v1 \
            --jwt-secret "$ZOU_CONFORMANCE_SECRET"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance
          path: /tmp/conformance.json
          if-no-files-found: ignore

  auth-conformance:
    name: conformance (auth)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: zou-conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ZOU_CONFORMANCE_DSN: postgres://postgres:zou-conformance@127.0.0.1:5432/postgres
      ZOU_CONFORMANCE_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      ZOU_CONFORMANCE_SUITES: /tmp/zou-conformance/suites
      GOTRUE_DSN: postgres://postgres:zou-conformance@127.0.0.1:5432/gotrue_ref
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the suites
        run: |
          git clone -q https://github.com/tamnd/zou-conformance /tmp/zou-conformance
          git -C /tmp/zou-conformance checkout -q "$(jq -r .ref conformance/suites.json)"
          git -C /tmp/zou-conformance log --oneline -1
      - name: Fetch the GoTrue the suite was recorded from
        run: |
          version=$(jq -r .gotrue.version /tmp/zou-conformance/versions.json)
          mkdir -p /tmp/gotrue
          curl -sSfL -o /tmp/gotrue.tar.xz \
            "https://github.com/supabase/auth/releases/download/v$version/auth-v$version-amd64.tar.xz"
          tar -xJf /tmp/gotrue.tar.xz -C /tmp/gotrue
          /tmp/gotrue/auth version
      # The reference keeps its rows in a database of its own, because it
      # brings its own migrations and runs them at boot, and a suite that
      # let them land next to zou's would be measuring whichever of the
      # two wrote the auth schema last.
      #
      # Everything here is what a project that has changed nothing gets
      # from supabase start, except the rate limits. Those are a
      # configured number and a clock rather than a compatibility
      # surface, and at the default the case that got the 429 would
      # depend on how long the run before it took.
      - name: Start the reference
        run: |
          psql "$ZOU_CONFORMANCE_DSN" -v ON_ERROR_STOP=1 -c 'create database gotrue_ref'
          # The first migration creates tables in auth without creating
          # auth, and the queries after it name no schema at all,
          # because upstream runs against the supabase image where the
          # schema is already there and the role it connects as has a
          # search_path pointing at it.
          psql "$GOTRUE_DSN" -v ON_ERROR_STOP=1 -c 'create schema auth'
          psql "$GOTRUE_DSN" -v ON_ERROR_STOP=1 \
            -c "alter role postgres in database gotrue_ref set search_path to auth, public"
          cat > /tmp/gotrue/.env <<'CONF'
          GOTRUE_API_HOST=127.0.0.1
          GOTRUE_API_PORT=54331
          API_EXTERNAL_URL=http://127.0.0.1:54331
          GOTRUE_DB_DRIVER=postgres
          GOTRUE_DB_NAMESPACE=auth
          GOTRUE_DB_MIGRATIONS_PATH=/tmp/gotrue/migrations
          GOTRUE_SITE_URL=http://localhost:3000
          GOTRUE_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long
          GOTRUE_JWT_EXP=3600
          GOTRUE_JWT_AUD=authenticated
          GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
          GOTRUE_DISABLE_SIGNUP=false
          GOTRUE_MAILER_AUTOCONFIRM=true
          GOTRUE_LOG_LEVEL=warn
          GOTRUE_RATE_LIMIT_EMAIL_SENT=100000
          GOTRUE_RATE_LIMIT_VERIFY=100000
          GOTRUE_RATE_LIMIT_TOKEN_REFRESH=100000
          GOTRUE_RATE_LIMIT_OTP=100000
          CONF
          echo "DATABASE_URL=$GOTRUE_DSN?sslmode=disable" >> /tmp/gotrue/.env
          (cd /tmp/gotrue && ./auth > /tmp/gotrue.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:54331/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:54331/health
      - name: Check zou against the recording
        run: |
          cargo run -p zou-conformance -- check --suite auth \
            --zou-dsn "$ZOU_CONFORMANCE_DSN" \
            --jwt-secret "$ZOU_CONFORMANCE_SECRET" \
            --json /tmp/auth.json
      # A bare GoTrue answers on / where a project answers on /auth/v1,
      # so the reference is asked with the prefix taken back off and the
      # cases stay the paths a client types.
      - name: Diff the auth suite against a live GoTrue
        run: |
          cargo run -p zou-conformance -- diff --suite auth \
            --zou-dsn "$ZOU_CONFORMANCE_DSN" \
            --reference-url http://127.0.0.1:54331 \
            --reference-name "gotrue live" \
            --reference-dsn "$GOTRUE_DSN" \
            --reference-strip-prefix /auth/v1 \
            --jwt-secret "$ZOU_CONFORMANCE_SECRET"
      - name: Keep the reference log
        if: always()
        run: cat /tmp/gotrue.log
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth
          path: /tmp/auth.json
          if-no-files-found: ignore

  # The storage suite has no diff step, which is the one thing that
  # makes it different from the two jobs above. storage-api ships as an
  # image and nothing else, so the only way to have the reference on a
  # runner is to bring up the whole local stack, and the recording was
  # taken from exactly that in the record workflow. Bumping the pinned
  # version means running that workflow again and reading the diff in
  # the recording, which is the same discipline the diff steps buy, paid
  # for at the other end.
  storage-conformance:
    name: conformance (storage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: zou-conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ZOU_CONFORMANCE_DSN: postgres://postgres:zou-conformance@127.0.0.1:5432/postgres
      ZOU_CONFORMANCE_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      ZOU_CONFORMANCE_SUITES: /tmp/zou-conformance/suites
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the suites
        run: |
          git clone -q https://github.com/tamnd/zou-conformance /tmp/zou-conformance
          git -C /tmp/zou-conformance checkout -q "$(jq -r .ref conformance/suites.json)"
          git -C /tmp/zou-conformance log --oneline -1
      # The fixture writes rows into storage.buckets and storage.objects,
      # and zou is what makes those tables, on the first connection it
      # takes out of the pool. So the target is started before the setup
      # is applied, which the harness does anyway, and there is nothing
      # to install here.
      - name: Check zou against the recording
        run: |
          cargo run -p zou-conformance -- check --suite storage \
            --zou-dsn "$ZOU_CONFORMANCE_DSN" \
            --jwt-secret "$ZOU_CONFORMANCE_SECRET" \
            --json /tmp/storage.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage
          path: /tmp/storage.json
          if-no-files-found: ignore

  supabase-js:
    name: conformance (supabase-js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: zou-conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ZOU_CONFORMANCE_DSN: postgres://postgres:zou-conformance@127.0.0.1:5432/postgres
      ZOU_CONFORMANCE_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the suites
        run: |
          git clone -q https://github.com/tamnd/zou-conformance /tmp/zou-conformance
          git -C /tmp/zou-conformance checkout -q "$(jq -r .ref conformance/suites.json)"
          git -C /tmp/zou-conformance log --oneline -1
      # serve prints the url last, after it has taken a connection and
      # applied the fixture, so a line starting with url is the whole
      # readiness check. The fixture has a foreign key into auth.users,
      # which zou creates on its first connection, and that ordering is
      # the reason serve applies it rather than a psql step here.
      - name: Start zou on the port a local supabase project uses
        run: |
          cargo run -p zou-conformance -- serve \
            --zou-dsn "$ZOU_CONFORMANCE_DSN" \
            --jwt-secret "$ZOU_CONFORMANCE_SECRET" \
            --setup /tmp/zou-conformance/js/setup.sql \
            > /tmp/serve.log 2>&1 &
          for i in $(seq 1 120); do
            grep -q '^url ' /tmp/serve.log && break
            sleep 1
          done
          cat /tmp/serve.log
          grep -q '^url ' /tmp/serve.log
      - name: Run supabase-js's own integration suite against it
        working-directory: /tmp/zou-conformance/js
        env:
          ZOU_URL: http://127.0.0.1:54321
          ZOU_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
        run: |
          npm ci
          npm test -- --reporter=default --reporter=json --outputFile.json=/tmp/js.json
      - name: Keep the server log
        if: always()
        run: cat /tmp/serve.log
      # For the scoreboard, which is generated in a job of its own out
      # of what the runs wrote rather than out of a second run.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-js
          path: /tmp/js.json
          if-no-files-found: ignore

  # One of Supabase's own example apps, unedited, driven through a real
  # browser. The suites ask a server questions and this asks an
  # application, which is a different claim: an app goes through the
  # client library, and the library reads headers, follows redirects,
  # parses a fragment and keeps a session in local storage, none of
  # which a request by request comparison exercises.
  demo:
    name: demo app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: zou-conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ZOU_CONFORMANCE_DSN: postgres://postgres:zou-conformance@127.0.0.1:5432/postgres
      ZOU_CONFORMANCE_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the suites
        run: |
          git clone -q https://github.com/tamnd/zou-conformance /tmp/zou-conformance
          git -C /tmp/zou-conformance checkout -q "$(jq -r .ref conformance/suites.json)"
          git -C /tmp/zou-conformance log --oneline -1
      # The provider credentials are the demo app's whole point here.
      # github is the one provider that can be pointed somewhere else,
      # because that is how a GitHub Enterprise install is reached, and
      # the stub the test run starts stands there. Everything on zou's
      # side of it is the real path.
      - name: Start zou on the port a local supabase project uses
        env:
          ZOU_EXTERNAL_GITHUB_CLIENT_ID: demo-client
          ZOU_EXTERNAL_GITHUB_SECRET: demo-secret
          ZOU_EXTERNAL_GITHUB_URL: http://127.0.0.1:54399
        run: |
          cargo run -p zou-conformance -- serve \
            --zou-dsn "$ZOU_CONFORMANCE_DSN" \
            --jwt-secret "$ZOU_CONFORMANCE_SECRET" \
            --setup /tmp/zou-conformance/demo/setup.sql \
            > /tmp/serve.log 2>&1 &
          for i in $(seq 1 120); do
            grep -q '^url ' /tmp/serve.log && break
            sleep 1
          done
          cat /tmp/serve.log
          grep -q '^url ' /tmp/serve.log
      - name: Drive the app in a browser
        working-directory: /tmp/zou-conformance/demo
        run: |
          npm ci
          npm run install:app
          npx playwright install --with-deps chromium
          npm test
      - name: Keep the server log
        if: always()
        run: cat /tmp/serve.log
      - name: Keep what the failing test saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-traces
          path: /tmp/zou-conformance/demo/test-results
          if-no-files-found: ignore

  # The third target the harness was written for. The recordings come
  # from the PostgREST binary, which is the same code, but a binary
  # configured by hand on a flag line is not the stack anybody runs.
  # `supabase start` is that stack: the images the CLI pins, a gateway
  # in front of them, and the api under /rest/v1 because something put
  # it there rather than because a suite asked for it. Asking both and
  # comparing the answers is a different question from asking one and
  # comparing it with a file.
  #
  # Nothing is recorded here and nothing is checked against a recording.
  # It is a diff, so the two targets are each other's expected answer,
  # and a difference is a difference whichever of them is right.
  cli:
    name: diff (supabase start)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: zou-conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ZOU_CONFORMANCE_DSN: postgres://postgres:zou-conformance@127.0.0.1:5432/postgres
      ZOU_CONFORMANCE_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      ZOU_CONFORMANCE_SUITES: /tmp/zou-conformance/suites
      # What the CLI serves a local project on, and the database behind
      # it. Both are the CLI's defaults rather than anything chosen
      # here, which is the point: a project that has changed nothing.
      CLI_URL: http://127.0.0.1:54321
      CLI_DSN: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the suites
        run: |
          git clone -q https://github.com/tamnd/zou-conformance /tmp/zou-conformance
          git -C /tmp/zou-conformance checkout -q "$(jq -r .ref conformance/suites.json)"
          git -C /tmp/zou-conformance log --oneline -1
      # The CLI version is pinned in versions.json next to the images it
      # brings, because the stack is the reference here and a reference
      # that moves on its own is not one.
      - name: Install the pinned supabase CLI
        run: |
          version=$(jq -r .supabase_cli.version /tmp/zou-conformance/versions.json)
          npm i -g "supabase@$version"
          supabase --version
      # The generated config, with one line changed. PostgREST only
      # serves the schemas it was told about, the suite keeps its tables
      # in a schema of its own, and the recording was taken from a
      # PostgREST configured with exactly these two in this order, since
      # the first is what a request that names no schema gets.
      - name: Bring up a local supabase project
        run: |
          mkdir -p /tmp/project
          cd /tmp/project
          supabase init --with-vscode-settings=false --with-intellij-settings=false
          python3 - <<'PY'
          path = "supabase/config.toml"
          out, section = [], ""
          for line in open(path):
              stripped = line.strip()
              if stripped.startswith("[") and stripped.endswith("]"):
                  section = stripped
              if section == "[api]" and stripped.startswith("schemas"):
                  line = 'schemas = ["conformance", "public"]\n'
              if section == "[api]" and stripped.startswith("extra_search_path"):
                  line = 'extra_search_path = ["public"]\n'
              out.append(line)
          open(path, "w").write("".join(out))
          PY
          grep -A 8 '^\[api\]' supabase/config.toml
          # The fixture goes in as a migration rather than being applied
          # afterwards, because PostgREST refuses to become healthy while
          # a schema it was told to serve does not exist, and the CLI
          # will not finish starting until it is healthy. The harness
          # applies it again over the reference dsn before it asks
          # anything, which is what it does for every target, and the
          # file is written to be applied twice.
          mkdir -p supabase/migrations
          cp /tmp/zou-conformance/suites/rest/setup.sql \
            supabase/migrations/20200101000000_conformance.sql
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector
          supabase status
      - name: Diff the rest suite against the stack a person gets
        run: |
          cargo run -p zou-conformance -- diff --suite rest \
            --zou-dsn "$ZOU_CONFORMANCE_DSN" \
            --reference-url "$CLI_URL" \
            --reference-name "supabase start" \
            --reference-dsn "$CLI_DSN" \
            --jwt-secret "$ZOU_CONFORMANCE_SECRET"
      - name: Keep what the stack was saying
        if: failure()
        run: |
          cd /tmp/project
          supabase status || true
          docker ps -a || true
          docker logs "$(docker ps -aqf name=supabase_rest)" 2>&1 | tail -60 || true

  # The numbers a merge measured, in a file in the repository rather
  # than in a log that expires. Only on main, and only out of the
  # artifacts the two conformance jobs left behind: rendering it here
  # from a run of its own would be a second measurement, and then the
  # published number would be one nobody had failed a build over.
  scoreboard:
    name: scoreboard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [conformance, auth-conformance, storage-conformance, supabase-js]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: conformance
          path: /tmp/reports
      - uses: actions/download-artifact@v4
        with:
          name: auth
          path: /tmp/reports
      - uses: actions/download-artifact@v4
        with:
          name: storage
          path: /tmp/reports
      - uses: actions/download-artifact@v4
        with:
          name: supabase-js
          path: /tmp/reports
      - name: Render it
        run: |
          cargo run -p zou-conformance -- scoreboard \
            --report /tmp/reports/conformance.json \
            --report /tmp/reports/auth.json \
            --report /tmp/reports/storage.json \
            --js /tmp/reports/js.json \
            --pin "$(jq -r .ref conformance/suites.json)" \
            --out docs/scoreboard.md
      # Nothing in the file moves on its own, so a merge that changed no
      # number leaves no diff and there is no commit. The skip marker
      # keeps the one that does from starting the whole workflow again
      # to measure what it just measured.
      #
      # A merge landing while this job measures moves main under it and
      # the push comes back rejected. The retry rebases, and gives way
      # if the file has been written in the meantime, because whoever
      # wrote it did so for a later commit than this one and the older
      # numbers are the ones worth losing.
      - name: Commit it if a number moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/scoreboard.md; then
            echo "no number moved"
            exit 0
          fi
          git add docs/scoreboard.md
          git commit -m "Scoreboard for ${GITHUB_SHA:0:12} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved, attempt $attempt"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "a later run wrote the scoreboard first, leaving it"
              exit 0
            fi
            if git diff --quiet origin/main -- docs/scoreboard.md; then
              echo "a later run wrote the same numbers, nothing to push"
              exit 0
            fi
          done
          echo "main kept moving, the next merge will measure this again"
          exit 1

  s3-contract:
    name: s3 contract (minio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=zou -e MINIO_ROOT_PASSWORD=zou-secret-key \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/ready && break
            sleep 1
          done
      - name: Create bucket
        run: |
          docker run --rm --network host --entrypoint sh minio/mc:latest -c \
            "mc alias set local http://127.0.0.1:9000 zou zou-secret-key && mc mb local/zou-test"
      - name: Run the CAS contract against MinIO
        env:
          ZOU_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          ZOU_S3_TEST_BUCKET: zou-test
          ZOU_S3_TEST_ACCESS_KEY: zou
          ZOU_S3_TEST_SECRET_KEY: zou-secret-key
        run: cargo test -p zou-store --features s3 --test cas_contract
      - name: Run the fault injection matrix through the chaos proxy
        env:
          ZOU_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          ZOU_S3_TEST_BUCKET: zou-test
          ZOU_S3_TEST_ACCESS_KEY: zou
          ZOU_S3_TEST_SECRET_KEY: zou-secret-key
          ZOU_S3_RETRY_BASE_MS: 25
        run: cargo test -p zou-store --features s3 --test s3_chaos -- --nocapture

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
