name: Postgres build

# Builds the vendored Postgres with the patch series applied and smoke
# tests the result. Scoped to paths that can affect the server binary so
# ordinary Rust PRs do not pay the build.

on:
  pull_request:
    paths:
      - vendor/**
      - .gitmodules
      - patches/**
      - scripts/pg-apply-patches.sh
      - Makefile
      - .github/workflows/postgres-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: vendored build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build flex bison libreadline-dev zlib1g-dev libicu-dev pkg-config
      - name: Build with the patch series applied
        run: make pg-build
      - name: Smoke test
        run: |
          build/pg/bin/initdb -D /tmp/zou-pgdata
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata -l /tmp/zou-pg.log start
          build/pg/bin/psql -h /tmp -d postgres -c 'select version()' | tee /tmp/version.txt
          grep -q "PostgreSQL 18.4" /tmp/version.txt
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata stop
