name: Postgres build

# Builds the vendored Postgres with the patch series applied and smoke
# tests the result. Scoped to paths that can affect the server binary so
# ordinary Rust PRs do not pay the build.

on:
  pull_request:
    paths:
      - vendor/**
      - .gitmodules
      - Cargo.lock
      - patches/**
      - scripts/pg-apply-patches.sh
      - scripts/zou-bundle.sh
      - scripts/zou-sbom.sh
      - packaging/npm/**
      - packaging/pypi/**
      - Makefile
      - crates/zou/**
      - crates/zou-pg/**
      - crates/zou-store/**
      - crates/zou-embed/**
      - crates/libzou/**
      - crates/zou-node/**
      - crates/zou-python/**
      - conformance/embedded.mjs
      - conformance/suites.json
      - go/**
      - .github/workflows/postgres-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: vendored build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build flex bison libreadline-dev zlib1g-dev libicu-dev liblz4-dev libzstd-dev libssl-dev libxml2-dev libxslt1-dev pkg-config uuid-dev patchelf
      - name: Build with the patch series applied
        run: make pg-build
      # The only job with both vendored trees checked out, so it is the
      # only one that can prove the sbom names the postmaster and the
      # vector extension rather than four hundred rust crates and a
      # confident silence about the largest thing in the bundle. The
      # script refuses to write a document it would not publish, so
      # this step failing is that refusal.
      - name: SBOM
        run: scripts/zou-sbom.sh --out /tmp/zou.cdx.json
      - name: Smoke test on md
        run: |
          build/pg/bin/initdb -D /tmp/md-pgdata
          build/pg/bin/pg_ctl -D /tmp/md-pgdata -l /tmp/md-pg.log start
          build/pg/bin/psql -h /tmp -d postgres -c 'select version()' | tee /tmp/version.txt
          grep -q "PostgreSQL 18.4" /tmp/version.txt
          build/pg/bin/pg_ctl -D /tmp/md-pgdata stop
      - name: Redo pool integration test
        run: ZOU_PG_PREFIX=$PWD/build/pg cargo test -p zou-pg --test redo_pool
      - name: GetPage integration test
        run: ZOU_PG_PREFIX=$PWD/build/pg cargo test -p zou-pg --test getpage
      - name: Shutdown integration test
        run: ZOU_PG_PREFIX=$PWD/build/pg cargo test -p zou-pg --test shutdown -- --test-threads=1
      - name: Page elision integration test
        run: ZOU_PG_PREFIX=$PWD/build/pg cargo test -p zou-pg --test elided -- --test-threads=1
      - name: Smoke test on zou storage
        run: |
          export ZOU_TARGET=/tmp/zou-pg-store
          mkdir -p "$ZOU_TARGET"
          # This step runs postgres itself, so there is no page
          # service to read through and the object path is what it tests.
          export ZOU_PAGESERVE=0
          build/pg/bin/initdb -D /tmp/zou-pgdata --set io_method=sync --set full_page_writes=off
          test "$(find $ZOU_TARGET/tenants/local/pg -type f | wc -l)" -gt 1000
          REDO=$(build/pg/bin/pg_controldata -D /tmp/zou-pgdata | grep "REDO location" | awk '{print $NF}')
          target/release/zou-bootstrap "$ZOU_TARGET" /tmp/zou-pgdata --redo "$REDO"
          test -s "$ZOU_TARGET/tenants/local/chk/genesis/INDEX"
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata -l /tmp/zou-pg.log start
          build/pg/bin/psql -h /tmp -d postgres -c "create table t(id int primary key, v text)" -c "insert into t select g, 'row ' || g from generate_series(1,1000) g"
          test "$(find $ZOU_TARGET/tenants/local/log/cellwal -type f ! -name manifest | wc -l)" -ge 2
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata restart -l /tmp/zou-pg.log
          build/pg/bin/psql -h /tmp -d postgres -c 'select count(*), sum(id) from t' | tee /tmp/reread.txt
          grep -q 500500 /tmp/reread.txt
          build/pg/bin/psql -h /tmp -d postgres -c checkpoint
          sleep 5
          grep -q '"kind": "delta"' "$ZOU_TARGET/tenants/local/MANIFEST"
          grep -q "folded a delta checkpoint" /tmp/zou-pg.log
          FILENODE=$(build/pg/bin/psql -h /tmp -d postgres -Atc "select relfilenode from pg_class where relname='t'")
          DELTA=$(ls "$ZOU_TARGET/tenants/local/chk/" | grep -v genesis | sort | tail -1)
          grep -q "^runs " "$ZOU_TARGET/tenants/local/chk/$DELTA/PAGES"
          grep -q "^p [0-9]* [0-9]* $FILENODE " "$ZOU_TARGET/tenants/local/chk/$DELTA/PAGES"
          test -s "$ZOU_TARGET/tenants/local/chk/$DELTA/00000000.pages"
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata stop
          ZOU_FOLD_DOWN_FACTOR=0 build/pg/bin/pg_ctl -D /tmp/zou-pgdata -l /tmp/zou-pg.log start
          build/pg/bin/psql -h /tmp -d postgres -c "insert into t select g, 'row ' || g from generate_series(1001,2000) g" -c checkpoint
          sleep 5
          grep -q "folded a full checkpoint" /tmp/zou-pg.log
          test "$(grep -c '"kind": "full"' $ZOU_TARGET/tenants/local/MANIFEST)" -eq 1
          ! grep -q '"kind": "delta"' "$ZOU_TARGET/tenants/local/MANIFEST"
          FULL=$(ls "$ZOU_TARGET/tenants/local/chk/" | grep -v genesis | sort | tail -1)
          grep -q "^s [0-9]* [0-9]* $FILENODE " "$ZOU_TARGET/tenants/local/chk/$FULL/PAGES"
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata stop
          grep -q "^p 1663 5 $FILENODE 0 0$" "$ZOU_TARGET/tenants/local/chk/$FULL/PAGES"
          rm "$ZOU_TARGET/tenants/local/pg/1663/5/$FILENODE/0/00000000"
          export ZOU_READ_CACHE_DIR=/tmp/zou-read-cache
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata -l /tmp/zou-pg.log start
          build/pg/bin/psql -h /tmp -d postgres -c 'select count(*), sum(id) from t' | tee /tmp/runread.txt
          grep -q 2001000 /tmp/runread.txt
          ! grep -q "chain reader poisoned" /tmp/zou-pg.log
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata stop
          test "$(ls $ZOU_READ_CACHE_DIR | wc -l)" -ge 1
          grep -q "zou read cache:" /tmp/zou-pg.log
          target/release/zou-gc "$ZOU_TARGET" 0 0 | tee /tmp/gc1.txt
          grep -q " 0 objects deleted" /tmp/gc1.txt
          target/release/zou-gc "$ZOU_TARGET" 0 0 | tee /tmp/gc2.txt
          ! grep -q " 0 objects deleted" /tmp/gc2.txt
          test ! -e "$ZOU_TARGET/tenants/local/chk/$DELTA/INDEX"
          test ! -e "$ZOU_TARGET/tenants/local/chk/genesis/INDEX"
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata -l /tmp/zou-pg.log start
          build/pg/bin/psql -h /tmp -d postgres -c 'select count(*), sum(id) from t' | tee /tmp/gcread.txt
          grep -q 2001000 /tmp/gcread.txt
          ! grep -q "chain reader poisoned" /tmp/zou-pg.log
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata stop
          cat /tmp/zou-pg.log
      - name: Restore and attach from the store alone
        run: |
          export ZOU_TARGET=/tmp/zou-pg-store
          # This step runs postgres itself, so there is no page
          # service to read through and the object path is what it tests.
          export ZOU_PAGESERVE=0
          target/release/zou-restore "$ZOU_TARGET" /tmp/zou-restored
          build/pg/bin/pg_controldata -D /tmp/zou-restored | grep -q "in production"
          build/pg/bin/pg_ctl -D /tmp/zou-restored -l /tmp/zou-restored.log start
          build/pg/bin/psql -h /tmp -d postgres -c 'select count(*), sum(id) from t' | tee /tmp/restored.txt
          grep -q 2001000 /tmp/restored.txt
          build/pg/bin/pg_ctl -D /tmp/zou-restored stop
          cat /tmp/zou-restored.log
      - name: kill -9 loop under pgbench load
        run: scripts/zou-crash-loop.sh 3
      # The same bring up, branch, and restore the dev loop does, driven
      # from a library instead of a command line, plus the in process
      # dispatch that has no command line equivalent.
      - name: the embedded library end to end
        run: ZOU_PG_BIN=$PWD/build/pg/bin cargo test -p zou-embed --test embed
      # What a database per test costs on this machine, against the
      # template the suite above already built. It is printed rather
      # than asserted on, because a shared runner is not a place to fail
      # a build over a millisecond. The log level breaks each create
      # into the branch, the restore, the postmaster and the front door,
      # which is what says whether a number measured on a laptop moved
      # anything here.
      - name: a database per test, timed
        run: RUST_LOG=zou_embed=debug ZOU_PG_BIN=$PWD/build/pg/bin cargo run --release -p zou-embed --example fixtures -- 20
      # And the same thing from C, against the hand written header, so
      # the shared library a binding loads is compiled and run rather
      # than assumed to still line up.
      - name: the C ABI end to end
        run: ZOU_PG_BIN=$PWD/build/pg/bin crates/libzou/tests/smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # And supabase-js talking to a database inside the node process,
      # which is the whole point of the binding: the same client a
      # browser would use, with no socket under it.
      - name: the node binding end to end
        run: |
          crates/zou-node/build.sh
          npm --prefix crates/zou-node install
          ZOU_PG_BIN=$PWD/build/pg/bin npm --prefix crates/zou-node test
      # And the conformance suites, asked of that same package. Every
      # other conformance job in this repository runs a zou linked into
      # the harness against a postgres in a container. This one asks
      # the thing that ships: the addon starts a postmaster over a
      # directory, the whole api answers inside the node process, and
      # nothing anywhere is a container.
      #
      # Three suites rather than four, and the fourth is left out
      # rather than forgotten. The postgrest suite re-applies its rows
      # before every case that writes, which against a postmaster this
      # process started is minutes of fixture for the same claim the
      # three below already make. It takes the same command line.
      - name: the suites against the node package
        run: |
          git clone -q https://github.com/tamnd/zou-conformance /tmp/zou-conformance
          git -C /tmp/zou-conformance checkout -q "$(jq -r .ref conformance/suites.json)"
          cargo build -p zou-conformance
          for suite in rest auth storage; do
            ZOU_PG_BIN=$PWD/build/pg/bin \
              node conformance/embedded.mjs "$suite" \
              --suites /tmp/zou-conformance/suites
          done
      # And supabase-py talking to a database inside the python
      # process, which is the same claim the node job above makes, in
      # the other language a test suite is likely to be written in.
      - name: the python binding end to end
        run: |
          crates/zou-python/build.sh
          python3 -m venv /tmp/zou-python-venv
          /tmp/zou-python-venv/bin/pip install --quiet supabase
          ZOU_PG_BIN=$PWD/build/pg/bin /tmp/zou-python-venv/bin/python -m unittest discover \
            -s crates/zou-python/test -v
      # And the same project behind an http.Client in a go process,
      # which is cgo over the same shared library the C program above
      # linked against.
      - name: the go binding end to end
        run: ZOU_PG_BIN=$PWD/build/pg/bin go/test.sh -v
      - name: zou dev, branch, and info end to end
        run: |
          # Branching reads the page runs a fold packed down, and with
          # the page service on the fold publishes an indexless
          # checkpoint instead, so this whole step is the object path
          # until a branch can be taken off the page layers.
          export ZOU_PAGESERVE=0
          cargo build -p zou --release
          mkdir -p /tmp/zou-dev-store
          target/release/zou dev /tmp/zou-dev-store --pg-bin build/pg/bin --port 5614 --runtime /tmp/zou-dev-run >/tmp/zou-dev.log 2>&1 &
          DEV=$!
          for i in $(seq 1 120); do
            build/pg/bin/psql -h 127.0.0.1 -p 5614 -U postgres -d postgres -Atc 'select 1' >/dev/null 2>&1 && break
            sleep 1
          done
          build/pg/bin/psql -h 127.0.0.1 -p 5614 -U postgres -d postgres -c "create table devt(id int)" -c "insert into devt select g from generate_series(1,100) g"
          kill -9 "$(head -1 /tmp/zou-dev-run/pgdata/postmaster.pid)"
          OUT=""
          for i in $(seq 1 120); do
            OUT=$(build/pg/bin/psql -h 127.0.0.1 -p 5614 -U postgres -d postgres -Atc 'select count(*) from devt' 2>/dev/null) && [ "$OUT" = 100 ] && break
            sleep 1
          done
          [ "$OUT" = 100 ]
          grep -q "restarting" /tmp/zou-dev.log
          kill -INT "$DEV"
          wait "$DEV"
          target/release/zou dev /tmp/zou-dev-store --pg-bin build/pg/bin --port 5614 --runtime /tmp/zou-dev-run2 >/tmp/zou-dev2.log 2>&1 &
          DEV2=$!
          OUT=""
          for i in $(seq 1 120); do
            OUT=$(build/pg/bin/psql -h 127.0.0.1 -p 5614 -U postgres -d postgres -Atc 'select count(*) from devt' 2>/dev/null) && [ "$OUT" = 100 ] && break
            sleep 1
          done
          [ "$OUT" = 100 ]
          grep -q "restored [0-9]* files" /tmp/zou-dev2.log
          kill -INT "$DEV2"
          wait "$DEV2"
          cat /tmp/zou-dev.log /tmp/zou-dev2.log
          # A branch reads the pages the source folded into runs, and a
          # database this young has only the capture it was bootstrapped
          # with, so the create refuses and leaves nothing behind.
          ! target/release/zou branch /tmp/zou-dev-store create local dev2 2>/tmp/zou-too-young.txt
          cat /tmp/zou-too-young.txt
          grep -q "cannot be branched yet" /tmp/zou-too-young.txt
          test ! -e /tmp/zou-dev-store/tenants/dev2/MANIFEST
          # Writes and checkpoints until the fold packs one down, which
          # is what a database that has been running a while has.
          target/release/zou dev /tmp/zou-dev-store --pg-bin build/pg/bin --port 5614 --runtime /tmp/zou-dev-run3 >/tmp/zou-dev3.log 2>&1 &
          DEV3=$!
          for i in $(seq 1 120); do
            build/pg/bin/psql -h 127.0.0.1 -p 5614 -U postgres -d postgres -Atc 'select 1' >/dev/null 2>&1 && break
            sleep 1
          done
          for i in $(seq 1 12); do
            build/pg/bin/psql -h 127.0.0.1 -p 5614 -U postgres -d postgres -c "insert into devt select g from generate_series(1,2000) g" -c checkpoint >/dev/null
            sleep 3
            # Through a file rather than a pipe, `grep -q` closes the
            # pipe on its first match and the writer dies of it.
            target/release/zou info /tmp/zou-dev-store >/tmp/zou-settling.txt
            grep -qE '^  [0-9a-f]{16} full at ' /tmp/zou-settling.txt && break
          done
          ROWS=$(build/pg/bin/psql -h 127.0.0.1 -p 5614 -U postgres -d postgres -Atc 'select count(*) from devt')
          kill -INT "$DEV3"
          wait "$DEV3"
          target/release/zou info /tmp/zou-dev-store | tee /tmp/zou-folded.txt
          grep -qE '^  [0-9a-f]{16} full at ' /tmp/zou-folded.txt
          target/release/zou branch /tmp/zou-dev-store create local dev2
          # And the branch serves, on its own ports, with the rows the
          # source had at the branch point and none of its own leaking
          # back the other way.
          target/release/zou dev /tmp/zou-dev-store --ref dev2 --pg-bin build/pg/bin --port 5615 --runtime /tmp/zou-dev-branch >/tmp/zou-dev-branch.log 2>&1 &
          BRANCH=$!
          OUT=""
          for i in $(seq 1 120); do
            OUT=$(build/pg/bin/psql -h 127.0.0.1 -p 5615 -U postgres -d postgres -Atc 'select count(*) from devt' 2>/dev/null) && [ "$OUT" = "$ROWS" ] && break
            sleep 1
          done
          [ "$OUT" = "$ROWS" ]
          build/pg/bin/psql -h 127.0.0.1 -p 5615 -U postgres -d postgres -c "insert into devt values (424242)"
          kill -INT "$BRANCH"
          wait "$BRANCH"
          cat /tmp/zou-dev-branch.log
          # A ref nobody branched is a typo, not a request for a second
          # database, and the dev loop says so instead of making one.
          ! target/release/zou dev /tmp/zou-dev-store --ref nope --pg-bin build/pg/bin --port 5616 --runtime /tmp/zou-dev-nope 2>/tmp/zou-no-ref.txt
          grep -q "take a branch first" /tmp/zou-no-ref.txt
          target/release/zou dev /tmp/zou-dev-store --pg-bin build/pg/bin --port 5614 --runtime /tmp/zou-dev-run4 >/tmp/zou-dev4.log 2>&1 &
          DEV4=$!
          OUT=""
          for i in $(seq 1 120); do
            OUT=$(build/pg/bin/psql -h 127.0.0.1 -p 5614 -U postgres -d postgres -Atc 'select count(*) from devt where id = 424242' 2>/dev/null) && break
            sleep 1
          done
          [ "$OUT" = 0 ]
          kill -INT "$DEV4"
          wait "$DEV4"
          target/release/zou info /tmp/zou-dev-store | tee /tmp/zou-info.txt
          grep -q "ref local" /tmp/zou-info.txt
          target/release/zou info /tmp/zou-dev-store dev2 | tee /tmp/zou-info2.txt
          grep -q "branch of local" /tmp/zou-info2.txt
          grep -q "owned by local" /tmp/zou-info2.txt
          target/release/zou branch /tmp/zou-dev-store list | tee /tmp/zou-branches.txt
          grep -q "dev2.*from local" /tmp/zou-branches.txt
          ! target/release/zou branch /tmp/zou-dev-store delete local
          target/release/zou branch /tmp/zou-dev-store delete dev2
          test ! -e /tmp/zou-dev-store/tenants/dev2/MANIFEST
          test -e /tmp/zou-dev-store/tenants/local/MANIFEST
      - name: A project's own config.toml drives the dev loop
        run: |
          mkdir -p /tmp/zou-proj/supabase /tmp/zou-proj-store
          cat > /tmp/zou-proj/supabase/config.toml <<'TOML'
          project_id = "smoke"

          [api]
          port = 54325
          schemas = ["public"]
          max_rows = 1000

          [db]
          port = 54326

          [auth]
          enable_anonymous_sign_ins = true
          TOML
          ZOU=$PWD/target/release/zou
          export ZOU_JWT_SECRET=$(openssl rand -hex 32)
          export ZOU_PG_BIN=$PWD/build/pg/bin
          cd /tmp/zou-proj
          "$ZOU" dev /tmp/zou-proj-store >/tmp/zou-proj.log 2>&1 &
          DEV=$!
          for i in $(seq 1 120); do
            "$ZOU" status >/tmp/zou-status.txt 2>&1 && break
            sleep 1
          done
          cat /tmp/zou-status.txt
          grep -q "API URL: http://127.0.0.1:54325" /tmp/zou-status.txt
          grep -q "DB URL: postgresql://postgres:postgres@127.0.0.1:54326/postgres" /tmp/zou-status.txt
          grep -q "not read yet: api.max_rows" /tmp/zou-status.txt
          eval "$("$ZOU" status -o env)"
          test -n "$ANON_KEY"
          curl -sf "$API_URL/auth/v1/settings" -H "apikey: $ANON_KEY" | tee /tmp/zou-settings.json
          grep -q '"anonymous_users":true' /tmp/zou-settings.json
          "$ZOU" status -o json | grep -q '"project_id":"smoke"'
          "$ZOU" migration new "add widgets" | tee /tmp/zou-migration.txt
          grep -q "supabase/migrations/[0-9]\{14\}_add_widgets.sql" /tmp/zou-migration.txt
          cat > "$(cat /tmp/zou-migration.txt)" <<'SQL'
          create table public.widgets (id bigserial primary key, name text not null);
          SQL
          cat > /tmp/zou-proj/supabase/seed.sql <<'SQL'
          insert into public.widgets (name) values ('from the seed');
          SQL
          "$ZOU" db push --dry-run | grep -q "would apply"
          "$ZOU" db push | tee /tmp/zou-push.txt
          grep -q "1 applied, 0 were already there" /tmp/zou-push.txt
          "$ZOU" db push | grep -q "nothing to apply"
          for i in $(seq 1 30); do
            curl -sf "$API_URL/rest/v1/widgets" -H "apikey: $ANON_KEY" >/tmp/zou-empty.json && break
            sleep 1
          done
          grep -qx '\[\]' /tmp/zou-empty.json
          curl -sf -X POST "$API_URL/rest/v1/widgets" -H "apikey: $SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' -d '{"name":"typed in by hand"}'
          "$ZOU" db reset | tee /tmp/zou-reset.txt
          grep -q "dropped schema public" /tmp/zou-reset.txt
          grep -q "seeded from" /tmp/zou-reset.txt
          for i in $(seq 1 30); do
            curl -sf "$API_URL/rest/v1/widgets?select=name" -H "apikey: $ANON_KEY" \
              >/tmp/zou-widgets.json && break
            sleep 1
          done
          cat /tmp/zou-widgets.json
          grep -q "from the seed" /tmp/zou-widgets.json
          ! grep -q "typed in by hand" /tmp/zou-widgets.json
          "$ZOU_PG_BIN/psql" "$DB_URL" -tAc "select count(*) from pg_event_trigger" | grep -qx 2
          "$ZOU_PG_BIN/psql" "$DB_URL" -tAc \
            "select count(*) from pg_namespace where nspname in ('auth','storage','zou')" | grep -qx 3
          ! "$ZOU" db reset --db-url postgresql://postgres@db.example.com:5432/postgres
          # A database built from the migrations and one built from the
          # same migrations in a shadow are the same database.
          "$ZOU" db diff 2>&1 | tee /tmp/zou-diff-clean.txt
          grep -q "no changes" /tmp/zou-diff-clean.txt
          # Now change it the way Studio would, and see the difference
          # come back as a migration that reproduces the change.
          "$ZOU_PG_BIN/psql" "$DB_URL" -q -v ON_ERROR_STOP=1 <<'SQL'
          create table public.notes (id bigint generated always as identity primary key, widget bigint references public.widgets (id), body text not null);
          alter table public.notes enable row level security;
          create policy "notes are mine" on public.notes for select to authenticated using (body <> '');
          create index notes_widget_idx on public.notes (widget);
          create view public.widget_notes as select w.name, n.body from public.widgets w join public.notes n on n.widget = w.id;
          comment on table public.notes is 'written in studio';
          SQL
          "$ZOU" db diff 2>/dev/null | tee /tmp/zou-diff.sql
          grep -q "create table public.notes" /tmp/zou-diff.sql
          grep -q 'create policy "notes are mine" on public.notes' /tmp/zou-diff.sql
          grep -q "create view public.widget_notes" /tmp/zou-diff.sql
          grep -q "comment on table public.notes is 'written in studio'" /tmp/zou-diff.sql
          ! grep -q "grant .* on table public.notes" /tmp/zou-diff.sql
          "$ZOU" db diff -f "studio changes" | tee /tmp/zou-diff-file.txt
          grep -q "supabase/migrations/[0-9]\{14\}_studio_changes.sql" /tmp/zou-diff-file.txt
          "$ZOU" db reset | grep -q "2 applied"
          "$ZOU" db diff 2>&1 | tee /tmp/zou-diff-again.txt
          grep -q "no changes" /tmp/zou-diff-again.txt
          kill -INT "$DEV"
          wait "$DEV" || true
          ! "$ZOU" status >/dev/null 2>&1
          cat /tmp/zou-proj.log
      - name: make demo, both acts
        run: make demo 2>&1 | tee /tmp/zou-demo.log && grep -q "restarting from nothing but the store" /tmp/zou-demo.log
      - name: Smoke test on MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=zou -e MINIO_ROOT_PASSWORD=zou-secret-key \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/ready && break
            sleep 1
          done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c \
            "mc alias set local http://127.0.0.1:9000 zou zou-secret-key && mc mb local/zou-pg"
          export ZOU_TARGET=s3://zou-pg/smoke
          # This step runs postgres itself, so there is no page
          # service to read through and the object path is what it tests.
          export ZOU_PAGESERVE=0
          export ZOU_S3_ENDPOINT=http://127.0.0.1:9000
          export AWS_ACCESS_KEY_ID=zou
          export AWS_SECRET_ACCESS_KEY=zou-secret-key
          build/pg/bin/initdb -D /tmp/minio-pgdata --set io_method=sync --set full_page_writes=off
          REDO=$(build/pg/bin/pg_controldata -D /tmp/minio-pgdata | grep "REDO location" | awk '{print $NF}')
          target/release/zou-bootstrap "$ZOU_TARGET" /tmp/minio-pgdata --redo "$REDO"
          build/pg/bin/pg_ctl -D /tmp/minio-pgdata -l /tmp/minio-pg.log start
          build/pg/bin/psql -h /tmp -d postgres -c "create table t(id int primary key)" -c "insert into t select g from generate_series(1,1000) g" -c checkpoint
          sleep 5
          grep -q "folded a" /tmp/minio-pg.log
          build/pg/bin/pg_ctl -D /tmp/minio-pgdata restart -l /tmp/minio-pg.log
          build/pg/bin/psql -h /tmp -d postgres -c 'select count(*), sum(id) from t' | tee /tmp/minio.txt
          grep -q 500500 /tmp/minio.txt
          build/pg/bin/pg_ctl -D /tmp/minio-pgdata stop
          target/release/zou-restore "$ZOU_TARGET" /tmp/minio-restored
          build/pg/bin/pg_ctl -D /tmp/minio-restored -l /tmp/minio-restored.log start
          build/pg/bin/psql -h /tmp -d postgres -c 'select count(*), sum(id) from t' | tee /tmp/minio-restored.txt
          grep -q 500500 /tmp/minio-restored.txt
          build/pg/bin/pg_ctl -D /tmp/minio-restored stop
          cat /tmp/minio-pg.log
      - name: Extension smoke on zou storage
        run: |
          export ZOU_TARGET=/tmp/zou-ext-store
          mkdir -p "$ZOU_TARGET"
          # This step runs postgres itself, so there is no page
          # service to read through and the object path is what it tests.
          export ZOU_PAGESERVE=0
          build/pg/bin/initdb -D /tmp/zou-ext-pgdata --set io_method=sync --set full_page_writes=off
          REDO=$(build/pg/bin/pg_controldata -D /tmp/zou-ext-pgdata | grep "REDO location" | awk '{print $NF}')
          target/release/zou-bootstrap "$ZOU_TARGET" /tmp/zou-ext-pgdata --redo "$REDO"
          build/pg/bin/pg_ctl -D /tmp/zou-ext-pgdata -l /tmp/zou-ext.log -o "-c shared_preload_libraries=pg_stat_statements" start
          build/pg/bin/psql -h /tmp -d postgres -v ON_ERROR_STOP=1 \
            -c 'create extension vector' \
            -c 'create extension pg_trgm' \
            -c 'create extension pgcrypto' \
            -c 'create extension "uuid-ossp"' \
            -c 'create extension pg_stat_statements' \
            -c "create table items(id int primary key, e vector(3))" \
            -c "insert into items values (1,'[1,2,3]'),(2,'[4,5,6]'),(3,'[1,1,1]')" \
            -c 'create index on items using hnsw (e vector_l2_ops)' \
            -c "select similarity('zou store', 'zou storage') > 0.4" \
            -c "select encode(digest('zou','sha256'),'hex')" \
            -c 'select uuid_generate_v4() is not null' \
            -c 'select count(*) > 0 from pg_stat_statements'
          build/pg/bin/pg_ctl -D /tmp/zou-ext-pgdata restart -l /tmp/zou-ext.log -o "-c shared_preload_libraries=pg_stat_statements"
          build/pg/bin/psql -h /tmp -d postgres -Atc "select id from items order by e <-> '[1,2,2]' limit 1" | tee /tmp/ext.txt
          grep -qx 1 /tmp/ext.txt
          build/pg/bin/pg_ctl -D /tmp/zou-ext-pgdata stop
          cat /tmp/zou-ext.log
      # What a download weighs, assembled the way an installer would,
      # with the 150 MB budget as the exit code. Then started out of the
      # bundle, because a bundle that is small and cannot run a database
      # is not a smaller bundle.
      - name: the release bundle, measured
        run: |
          scripts/zou-bundle.sh --tar
          BUNDLE=$PWD/dist/zou-linux-x64
          # Out of the way goes the tree these files were built in, so
          # what starts below is the bundle on its own, the way it
          # arrives on a machine that never built anything.
          mv build/pg /tmp/pg-build-tree
          $BUNDLE/pg/bin/initdb -D /tmp/bundle-pgdata
          $BUNDLE/pg/bin/postgres -D /tmp/bundle-pgdata -k /tmp -p 5617 >/tmp/bundle-pg.log 2>&1 &
          for i in $(seq 1 60); do
            $BUNDLE/pg/bin/psql -h /tmp -p 5617 -d postgres -Atc 'select 1' >/dev/null 2>&1 && break
            sleep 1
          done
          $BUNDLE/pg/bin/psql -h /tmp -p 5617 -d postgres -v ON_ERROR_STOP=1 \
            -c 'select version()' \
            -c 'create extension vector' \
            -c 'select count(*) > 0 from pg_timezone_names'
          kill -INT "$(head -1 /tmp/bundle-pgdata/postmaster.pid)"
          $BUNDLE/bin/zou --version
      # The npm command line package is a postinstall that downloads a
      # release, so testing it before there is a release means serving
      # one. This is the tarball the step above just built, over
      # localhost, checksum and all.
      - name: the npm command line package
        run: |
          cd dist
          sha256sum zou-linux-x64.tar.gz > zou-linux-x64.tar.gz.sha256
          python3 -m http.server 8617 >/dev/null 2>&1 &
          # The server takes a moment to bind and the postinstall does not
          # retry, so ask for the checksum until it answers rather than
          # racing it and failing the job with "fetch failed".
          for _ in $(seq 100); do
            curl -sfo /dev/null http://127.0.0.1:8617/zou-linux-x64.tar.gz.sha256 && break
            sleep 0.1
          done
          cd ../packaging/npm
          ZOU_BASE_URL=http://127.0.0.1:8617 ZOU_VERSION=v0.0.0-ci node install.js
          ./bin/zou.js --version
          # And the postgres it brought with it, which is the half of
          # this package that npm is a strange way to deliver.
          vendor/zou-linux-x64/pg/bin/postgres --version
      # What pip install zou zou-postgres gets: two wheels, one with the
      # extension and one with the postgres it starts, installed into a
      # venv that has no ZOU_PG_BIN and no checkout to fall back on. The
      # python suite then runs against what a user would have.
      - name: the wheels, installed and run
        run: |
          python3 -m venv /tmp/zou-wheel-venv
          /tmp/zou-wheel-venv/bin/pip install --quiet maturin supabase
          PYTHON=/tmp/zou-wheel-venv/bin/python packaging/pypi/zou-postgres/build.sh
          /tmp/zou-wheel-venv/bin/maturin build --release \
            --manifest-path crates/zou-python/Cargo.toml --out dist/wheels
          /tmp/zou-wheel-venv/bin/pip install --quiet --force-reinstall dist/wheels/*.whl
          ls -l dist/wheels
          # The extension is in site-packages now, so the test has to
          # run from somewhere the source tree cannot shadow it.
          cp -r crates/zou-python/test /tmp/zou-wheel-test
          cd /tmp/zou-wheel-test
          env -u ZOU_PG_BIN /tmp/zou-wheel-venv/bin/python -m unittest discover -s . -v
