name: Postgres build

# Builds the vendored Postgres with the patch series applied and smoke
# tests the result. Scoped to paths that can affect the server binary so
# ordinary Rust PRs do not pay the build.

on:
  pull_request:
    paths:
      - vendor/**
      - .gitmodules
      - patches/**
      - scripts/pg-apply-patches.sh
      - Makefile
      - crates/zou/**
      - crates/zou-pg/**
      - crates/zou-store/**
      - .github/workflows/postgres-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: vendored build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build flex bison libreadline-dev zlib1g-dev libicu-dev pkg-config uuid-dev
      - name: Build with the patch series applied
        run: make pg-build
      - name: Smoke test on md
        run: |
          build/pg/bin/initdb -D /tmp/md-pgdata
          build/pg/bin/pg_ctl -D /tmp/md-pgdata -l /tmp/md-pg.log start
          build/pg/bin/psql -h /tmp -d postgres -c 'select version()' | tee /tmp/version.txt
          grep -q "PostgreSQL 18.4" /tmp/version.txt
          build/pg/bin/pg_ctl -D /tmp/md-pgdata stop
      - name: Redo pool integration test
        run: ZOU_PG_PREFIX=$PWD/build/pg cargo test -p zou-pg --test redo_pool
      - name: Smoke test on zou storage
        run: |
          export ZOU_TARGET=/tmp/zou-pg-store
          mkdir -p "$ZOU_TARGET"
          build/pg/bin/initdb -D /tmp/zou-pgdata --set io_method=sync
          test "$(find $ZOU_TARGET/tenants/local/pg -type f | wc -l)" -gt 1000
          REDO=$(build/pg/bin/pg_controldata -D /tmp/zou-pgdata | grep "REDO location" | awk '{print $NF}')
          target/release/zou-bootstrap "$ZOU_TARGET" /tmp/zou-pgdata --redo "$REDO"
          test -s "$ZOU_TARGET/tenants/local/chk/genesis/INDEX"
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata -l /tmp/zou-pg.log start
          build/pg/bin/psql -h /tmp -d postgres -c "create table t(id int primary key, v text)" -c "insert into t select g, 'row ' || g from generate_series(1,1000) g"
          test "$(find $ZOU_TARGET/cellwal -type f ! -name manifest | wc -l)" -ge 2
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata restart -l /tmp/zou-pg.log
          build/pg/bin/psql -h /tmp -d postgres -c 'select count(*), sum(id) from t' | tee /tmp/reread.txt
          grep -q 500500 /tmp/reread.txt
          build/pg/bin/psql -h /tmp -d postgres -c checkpoint
          sleep 5
          grep -q '"kind": "delta"' "$ZOU_TARGET/tenants/local/MANIFEST"
          grep -q "folded a delta checkpoint" /tmp/zou-pg.log
          FILENODE=$(build/pg/bin/psql -h /tmp -d postgres -Atc "select relfilenode from pg_class where relname='t'")
          DELTA=$(ls "$ZOU_TARGET/tenants/local/chk/" | grep -v genesis | sort | tail -1)
          grep -q "^runs " "$ZOU_TARGET/tenants/local/chk/$DELTA/PAGES"
          grep -q "^p [0-9]* [0-9]* $FILENODE " "$ZOU_TARGET/tenants/local/chk/$DELTA/PAGES"
          test -s "$ZOU_TARGET/tenants/local/chk/$DELTA/00000000.pages"
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata stop
          ZOU_FOLD_DOWN_FACTOR=0 build/pg/bin/pg_ctl -D /tmp/zou-pgdata -l /tmp/zou-pg.log start
          build/pg/bin/psql -h /tmp -d postgres -c "insert into t select g, 'row ' || g from generate_series(1001,2000) g" -c checkpoint
          sleep 5
          grep -q "folded a full checkpoint" /tmp/zou-pg.log
          test "$(grep -c '"kind": "full"' $ZOU_TARGET/tenants/local/MANIFEST)" -eq 1
          ! grep -q '"kind": "delta"' "$ZOU_TARGET/tenants/local/MANIFEST"
          FULL=$(ls "$ZOU_TARGET/tenants/local/chk/" | grep -v genesis | sort | tail -1)
          grep -q "^s [0-9]* [0-9]* $FILENODE " "$ZOU_TARGET/tenants/local/chk/$FULL/PAGES"
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata stop
          grep -q "^p 1663 5 $FILENODE 0 0$" "$ZOU_TARGET/tenants/local/chk/$FULL/PAGES"
          rm "$ZOU_TARGET/tenants/local/pg/1663/5/$FILENODE/0/00000000"
          export ZOU_READ_CACHE_DIR=/tmp/zou-read-cache
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata -l /tmp/zou-pg.log start
          build/pg/bin/psql -h /tmp -d postgres -c 'select count(*), sum(id) from t' | tee /tmp/runread.txt
          grep -q 2001000 /tmp/runread.txt
          ! grep -q "chain reader poisoned" /tmp/zou-pg.log
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata stop
          test "$(ls $ZOU_READ_CACHE_DIR | wc -l)" -ge 1
          grep -q "zou read cache:" /tmp/zou-pg.log
          target/release/zou-gc "$ZOU_TARGET" 0 0 | tee /tmp/gc1.txt
          grep -q " 0 objects deleted" /tmp/gc1.txt
          target/release/zou-gc "$ZOU_TARGET" 0 0 | tee /tmp/gc2.txt
          ! grep -q " 0 objects deleted" /tmp/gc2.txt
          test ! -e "$ZOU_TARGET/tenants/local/chk/$DELTA/INDEX"
          test ! -e "$ZOU_TARGET/tenants/local/chk/genesis/INDEX"
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata -l /tmp/zou-pg.log start
          build/pg/bin/psql -h /tmp -d postgres -c 'select count(*), sum(id) from t' | tee /tmp/gcread.txt
          grep -q 2001000 /tmp/gcread.txt
          ! grep -q "chain reader poisoned" /tmp/zou-pg.log
          build/pg/bin/pg_ctl -D /tmp/zou-pgdata stop
          cat /tmp/zou-pg.log
      - name: Restore and attach from the store alone
        run: |
          export ZOU_TARGET=/tmp/zou-pg-store
          target/release/zou-restore "$ZOU_TARGET" /tmp/zou-restored
          build/pg/bin/pg_controldata -D /tmp/zou-restored | grep -q "in production"
          build/pg/bin/pg_ctl -D /tmp/zou-restored -l /tmp/zou-restored.log start
          build/pg/bin/psql -h /tmp -d postgres -c 'select count(*), sum(id) from t' | tee /tmp/restored.txt
          grep -q 2001000 /tmp/restored.txt
          build/pg/bin/pg_ctl -D /tmp/zou-restored stop
          cat /tmp/zou-restored.log
      - name: kill -9 loop under pgbench load
        run: scripts/zou-crash-loop.sh 3
      - name: zou dev, branch, and info end to end
        run: |
          cargo build -p zou --release
          mkdir -p /tmp/zou-dev-store
          target/release/zou dev /tmp/zou-dev-store --pg-bin build/pg/bin --port 5614 --runtime /tmp/zou-dev-run >/tmp/zou-dev.log 2>&1 &
          DEV=$!
          for i in $(seq 1 120); do
            build/pg/bin/psql -h 127.0.0.1 -p 5614 -d postgres -Atc 'select 1' >/dev/null 2>&1 && break
            sleep 1
          done
          build/pg/bin/psql -h 127.0.0.1 -p 5614 -d postgres -c "create table devt(id int)" -c "insert into devt select g from generate_series(1,100) g"
          kill -9 "$(head -1 /tmp/zou-dev-run/pgdata/postmaster.pid)"
          OUT=""
          for i in $(seq 1 120); do
            OUT=$(build/pg/bin/psql -h 127.0.0.1 -p 5614 -d postgres -Atc 'select count(*) from devt' 2>/dev/null) && [ "$OUT" = 100 ] && break
            sleep 1
          done
          [ "$OUT" = 100 ]
          grep -q "restarting" /tmp/zou-dev.log
          kill -INT "$DEV"
          wait "$DEV"
          target/release/zou dev /tmp/zou-dev-store --pg-bin build/pg/bin --port 5614 --runtime /tmp/zou-dev-run2 >/tmp/zou-dev2.log 2>&1 &
          DEV2=$!
          OUT=""
          for i in $(seq 1 120); do
            OUT=$(build/pg/bin/psql -h 127.0.0.1 -p 5614 -d postgres -Atc 'select count(*) from devt' 2>/dev/null) && [ "$OUT" = 100 ] && break
            sleep 1
          done
          [ "$OUT" = 100 ]
          grep -q "restored [0-9]* files" /tmp/zou-dev2.log
          kill -INT "$DEV2"
          wait "$DEV2"
          cat /tmp/zou-dev.log /tmp/zou-dev2.log
          target/release/zou branch /tmp/zou-dev-store local dev2
          target/release/zou info /tmp/zou-dev-store | tee /tmp/zou-info.txt
          grep -q "ref local" /tmp/zou-info.txt
          target/release/zou info /tmp/zou-dev-store dev2 | tee /tmp/zou-info2.txt
          grep -q "branch of local" /tmp/zou-info2.txt
          grep -q "owned by local" /tmp/zou-info2.txt
      - name: make demo, both acts
        run: make demo 2>&1 | tee /tmp/zou-demo.log && grep -q "restarting from nothing but the store" /tmp/zou-demo.log
      - name: Smoke test on MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=zou -e MINIO_ROOT_PASSWORD=zou-secret-key \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/ready && break
            sleep 1
          done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c \
            "mc alias set local http://127.0.0.1:9000 zou zou-secret-key && mc mb local/zou-pg"
          export ZOU_TARGET=s3://zou-pg/smoke
          export ZOU_S3_ENDPOINT=http://127.0.0.1:9000
          export AWS_ACCESS_KEY_ID=zou
          export AWS_SECRET_ACCESS_KEY=zou-secret-key
          build/pg/bin/initdb -D /tmp/minio-pgdata --set io_method=sync
          REDO=$(build/pg/bin/pg_controldata -D /tmp/minio-pgdata | grep "REDO location" | awk '{print $NF}')
          target/release/zou-bootstrap "$ZOU_TARGET" /tmp/minio-pgdata --redo "$REDO"
          build/pg/bin/pg_ctl -D /tmp/minio-pgdata -l /tmp/minio-pg.log start
          build/pg/bin/psql -h /tmp -d postgres -c "create table t(id int primary key)" -c "insert into t select g from generate_series(1,1000) g" -c checkpoint
          sleep 5
          grep -q "folded a" /tmp/minio-pg.log
          build/pg/bin/pg_ctl -D /tmp/minio-pgdata restart -l /tmp/minio-pg.log
          build/pg/bin/psql -h /tmp -d postgres -c 'select count(*), sum(id) from t' | tee /tmp/minio.txt
          grep -q 500500 /tmp/minio.txt
          build/pg/bin/pg_ctl -D /tmp/minio-pgdata stop
          target/release/zou-restore "$ZOU_TARGET" /tmp/minio-restored
          build/pg/bin/pg_ctl -D /tmp/minio-restored -l /tmp/minio-restored.log start
          build/pg/bin/psql -h /tmp -d postgres -c 'select count(*), sum(id) from t' | tee /tmp/minio-restored.txt
          grep -q 500500 /tmp/minio-restored.txt
          build/pg/bin/pg_ctl -D /tmp/minio-restored stop
          cat /tmp/minio-pg.log
      - name: Extension smoke on zou storage
        run: |
          export ZOU_TARGET=/tmp/zou-ext-store
          mkdir -p "$ZOU_TARGET"
          build/pg/bin/initdb -D /tmp/zou-ext-pgdata --set io_method=sync
          REDO=$(build/pg/bin/pg_controldata -D /tmp/zou-ext-pgdata | grep "REDO location" | awk '{print $NF}')
          target/release/zou-bootstrap "$ZOU_TARGET" /tmp/zou-ext-pgdata --redo "$REDO"
          build/pg/bin/pg_ctl -D /tmp/zou-ext-pgdata -l /tmp/zou-ext.log -o "-c shared_preload_libraries=pg_stat_statements" start
          build/pg/bin/psql -h /tmp -d postgres -v ON_ERROR_STOP=1 \
            -c 'create extension vector' \
            -c 'create extension pg_trgm' \
            -c 'create extension pgcrypto' \
            -c 'create extension "uuid-ossp"' \
            -c 'create extension pg_stat_statements' \
            -c "create table items(id int primary key, e vector(3))" \
            -c "insert into items values (1,'[1,2,3]'),(2,'[4,5,6]'),(3,'[1,1,1]')" \
            -c 'create index on items using hnsw (e vector_l2_ops)' \
            -c "select similarity('zou store', 'zou storage') > 0.4" \
            -c "select encode(digest('zou','sha256'),'hex')" \
            -c 'select uuid_generate_v4() is not null' \
            -c 'select count(*) > 0 from pg_stat_statements'
          build/pg/bin/pg_ctl -D /tmp/zou-ext-pgdata restart -l /tmp/zou-ext.log -o "-c shared_preload_libraries=pg_stat_statements"
          build/pg/bin/psql -h /tmp -d postgres -Atc "select id from items order by e <-> '[1,2,2]' limit 1" | tee /tmp/ext.txt
          grep -qx 1 /tmp/ext.txt
          build/pg/bin/pg_ctl -D /tmp/zou-ext-pgdata stop
          cat /tmp/zou-ext.log
