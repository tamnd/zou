name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # What signs the provenance. id-token is the OIDC token sigstore
  # trades for a short lived certificate, so there is no key anywhere
  # to keep or to lose, and attestations is where the signed statement
  # is stored afterwards.
  id-token: write
  attestations: write

jobs:
  # What a person downloads: the zou binary and the patched postgres it
  # starts, in one tree. Building postgres per target is fifteen minutes
  # a target, which is why this runs on tags rather than on pushes.
  bundle:
    name: bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: darwin-x64
            os: macos-13
          - name: darwin-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y meson ninja-build flex bison libreadline-dev zlib1g-dev libicu-dev liblz4-dev libzstd-dev libssl-dev libxml2-dev libxslt1-dev pkg-config uuid-dev patchelf
          else
            brew install meson ninja icu4c pkg-config bison flex
            echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig" >> "$GITHUB_ENV"
            # The bison and flex in the SDK are older than the ones the
            # postgres grammar is written against.
            echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          fi
      - name: Build the patched Postgres
        run: make pg-build
      # With the javascript engine in it, because a person who downloads
      # a bundle should not have to rebuild it to run a function. It is
      # the reason the binary is seventy megabytes rather than twenty.
      - name: Build zou
        run: cargo build --release -p zou --features zou-deno/isolate
      - name: Assemble the bundle
        run: scripts/zou-bundle.sh --tar
      - name: Start a database out of it
        run: |
          BUNDLE=$PWD/dist/zou-${{ matrix.name }}
          # The build tree is what postgres was linked against, so it
          # goes out of the way before anything is started: what runs
          # after this is the bundle standing on its own, which is the
          # only way it will ever arrive on someone else's machine.
          mv build/pg "$RUNNER_TEMP/pg-build-tree"
          $BUNDLE/pg/bin/initdb -D "$RUNNER_TEMP/bundle-pgdata"
          $BUNDLE/pg/bin/postgres -D "$RUNNER_TEMP/bundle-pgdata" -k "$RUNNER_TEMP" -p 5618 >"$RUNNER_TEMP/bundle-pg.log" 2>&1 &
          for i in $(seq 1 60); do
            $BUNDLE/pg/bin/psql -h "$RUNNER_TEMP" -p 5618 -d postgres -Atc 'select 1' >/dev/null 2>&1 && break
            sleep 1
          done
          $BUNDLE/pg/bin/psql -h "$RUNNER_TEMP" -p 5618 -d postgres -v ON_ERROR_STOP=1 -c 'select version()' -c 'create extension vector'
          kill -INT "$(head -1 "$RUNNER_TEMP/bundle-pgdata/postmaster.pid")"
          $BUNDLE/bin/zou --version
      # The same tree again as a wheel, so pip install zou zou-postgres
      # is a project with a postmaster and nothing to configure. It is
      # built here rather than in the wheels job because this is the job
      # that has a bundle.
      - name: The postgres wheel
        run: |
          # A dispatch run has a branch name where a tag would be, and
          # that is not a version, so it builds one that says 0.0.1 and
          # is never published.
          case "$GITHUB_REF" in
            refs/tags/v*) packaging/pypi/zou-postgres/build.sh --version "${GITHUB_REF_NAME#v}" ;;
            *) packaging/pypi/zou-postgres/build.sh ;;
          esac
      - name: Checksum
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum zou-${{ matrix.name }}.tar.gz > zou-${{ matrix.name }}.tar.gz.sha256
          else
            shasum -a 256 zou-${{ matrix.name }}.tar.gz > zou-${{ matrix.name }}.tar.gz.sha256
          fi
          cat zou-${{ matrix.name }}.tar.gz.sha256
      # What is inside it, which the checksum does not say. Written
      # here rather than in one job at the end because it is per
      # platform: the rust graph is resolved for this target with the
      # features this bundle was built with, and the postgres in it is
      # the one this leg just compiled.
      - name: SBOM
        run: |
          scripts/zou-sbom.sh \
            --version "${GITHUB_REF_NAME#v}" \
            --tarball dist/zou-${{ matrix.name }}.tar.gz \
            --out dist/zou-${{ matrix.name }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: zou-${{ matrix.name }}
          path: |
            dist/zou-${{ matrix.name }}.tar.gz
            dist/zou-${{ matrix.name }}.tar.gz.sha256
            dist/zou-${{ matrix.name }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-postgres-${{ matrix.name }}
          path: dist/wheels/*.whl

  # Windows has no embedded story and no patched postgres, so it gets
  # the binary on its own, which is what every target got before. It has
  # no javascript engine either: the dev loop that would start a function
  # is unix only, so the feature would be fifty megabytes of dead weight.
  windows:
    name: windows (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: zou
          target: ${{ matrix.target }}
          zip: windows
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # The python binding, which is an extension module and nothing else:
  # no postgres in it, so it builds in a manylinux container and runs
  # anywhere that has a python. One abi3 wheel per platform covers 3.9
  # and everything after it.
  wheels:
    name: wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          - name: darwin-x64
            os: macos-13
            target: x86_64
            manylinux: "off"
          - name: darwin-arm64
            os: macos-latest
            target: aarch64
            manylinux: "off"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The wheel is named after the tag, since the version a person
      # installed is the version they should get. A dispatch run has no
      # tag and builds one that says 0.0.1 and is never published.
      - name: The version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i.bak "s/^version = \".*\"$/version = \"${GITHUB_REF_NAME#v}\"/" crates/zou-python/pyproject.toml
          rm crates/zou-python/pyproject.toml.bak
          grep '^version' crates/zou-python/pyproject.toml
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path crates/zou-python/Cargo.toml --out dist/wheels
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
      - run: ls -l dist/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-zou-${{ matrix.name }}
          path: dist/wheels/*.whl

  publish:
    name: publish the bundles
    # The wheels as well, because a release page that has the tarballs
    # and not the wheels is a release that is half there. Windows too,
    # not because anything of its is uploaded here, but because this is
    # where everything is attested and a windows zip nobody attested
    # would be the one asset a person cannot check.
    needs: [bundle, wheels, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The windows job uploads straight to the release, so its zips
      # come back down from there to be attested with the rest.
      - name: Fetch what windows already uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
            --pattern '*windows*' --dir dist --clobber || echo "no windows assets yet"
      - run: ls -l dist
      # Every asset gets a statement, signed through sigstore, saying
      # which workflow at which commit produced it. A sha256 published
      # on the same page as the file it describes answers whether a
      # download finished; this answers whether the file is the one
      # this repository built, which is the question somebody who did
      # not download it from here needs answered.
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # The npm command line package downloads the bundles the job above
  # just uploaded, so it is published after them and never before: a
  # version of zou-cli that points at a release with no assets in it is
  # a broken install for anyone quick enough to get it.
  npm:
    name: publish zou-cli
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "no NPM_TOKEN, so zou-cli is not published, the tarballs on the release are still there"
            exit 0
          fi
          cd packaging/npm
          # The package version is the tag, because the postinstall
          # downloads the release of the same name.
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          # The registry records where this came from, the same way the
          # release assets do, so the package page says which workflow
          # at which commit built it rather than only who uploaded it.
          npm publish --access public --provenance
  # Both wheels together, since pip install zou zou-postgres is the
  # pair: the extension module for every platform, and the patched
  # postgres for every platform. They carry no assets from the release,
  # so this waits on the jobs that built them and on nothing else.
  pypi:
    name: publish the wheels
    needs: [bundle, wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/wheels
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ls -l dist/wheels
      - name: Publish
        env:
          TWINE_USERNAME: __token__
          # One token for both projects, which means an account token
          # rather than a project one.
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "no PYPI_TOKEN, so nothing goes to pypi, the wheels are on the release either way"
            exit 0
          fi
          pip install --quiet twine
          twine upload --non-interactive dist/wheels/*.whl


  # The homebrew formula, which is a pointer at the two mac tarballs and
  # their sums, so it is written after they are uploaded and out of the
  # checksums that were uploaded with them.
  brew:
    name: publish the formula
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: zou-darwin-*
          path: dist
          merge-multiple: true
      - name: Write it
        run: |
          packaging/brew/formula.sh --version "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > zou.rb
          cat zou.rb
      - name: Push it to the tap
        env:
          # A token with write access to the tap repository, which is a
          # second repository and so not something GITHUB_TOKEN reaches.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "no HOMEBREW_TAP_TOKEN, so the formula is not pushed, it is in the log above"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-zou.git" tap
          mkdir -p tap/Formula
          cp zou.rb tap/Formula/zou.rb
          cd tap
          git config user.name "Tam Nguyen Duc"
          git config user.email "1218621+tamnd@users.noreply.github.com"
          git add Formula/zou.rb
          git commit -m "zou ${GITHUB_REF_NAME}" || { echo "the formula is already this release"; exit 0; }
          git push
