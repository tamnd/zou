[package]
name = "zou"
description = "Supabase compatible backend on object storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The javascript engine, and fifty megabytes of V8 with it, behind that
# crate's own `isolate` feature. The dependency is not optional and
# there is deliberately no feature here that turns it on, because a
# feature here would be one `cargo test --workspace --all-features`
# enables, and an ordinary build of this repository should not be
# downloading V8. `--features zou-deno/isolate` is the way in, and
# asking for it is the whole point.
zou-deno = { path = "../zou-deno" }
zou-functions = { path = "../zou-functions" }
zou-log = { path = "../zou-log" }
zou-ops = { path = "../zou-ops" }
zou-pg = { path = "../zou-pg" }
zou-store = { path = "../zou-store" }
base64ct = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
zou-server = { path = "../zou-server" }

[lints]
workspace = true
