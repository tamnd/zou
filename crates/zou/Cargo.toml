[package]
name = "zou"
description = "Supabase compatible backend on object storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The javascript engine, and fifty megabytes of V8 with it, behind that
# crate's own `isolate` feature. The dependency is not optional and
# there is deliberately no feature here that turns it on, because a
# feature here would be one `cargo test --workspace --all-features`
# enables, and an ordinary build of this repository should not be
# downloading V8. `--features zou-deno/isolate` is the way in, and
# asking for it is the whole point.
zou-deno = { path = "../zou-deno" }
zou-functions = { path = "../zou-functions" }
zou-log = { path = "../zou-log" }
zou-ops = { path = "../zou-ops" }
zou-pg = { path = "../zou-pg" }
zou-store = { path = "../zou-store" }
base64ct = { workspace = true }
chacha20poly1305 = { workspace = true }
# A copy from one database into another is a stream out of one socket
# into the other, which is a stream and a sink, which is what sink is
# for.
futures-util = { version = "0.3", default-features = false, features = [
    "alloc",
    "sink",
] }
getrandom = { workspace = true }
hmac = { workspace = true }
log = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tokio-postgres-rustls = { workspace = true }
# The bytes of a hosted project's storage objects come over http and
# nothing else here does, so this is the one http client in the binary
# and it is the one the store already builds.
ureq = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
zou-server = { path = "../zou-server" }

[lints]
workspace = true
