[package]
name = "zou-server"
description = "HTTP front door: Supabase compatible routing, keys, and JWT context"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64ct = { workspace = true }
bcrypt = { version = "0.19", default-features = false, features = ["std", "zeroize"] }
bytes = "1"
getrandom = { workspace = true }
hmac = { workspace = true }
image = { workspace = true }
log = { workspace = true }
md-5 = "0.11"
p256 = { workspace = true }
qrcodegen = "1.8"
rustls = { workspace = true }
serde_json = { workspace = true }
sha1 = "0.11"
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tower = { workspace = true, features = ["util"] }
ureq = { workspace = true }
webp = { workspace = true }
webpki-roots = { workspace = true }
zou-ops = { path = "../zou-ops" }
zou-realtime = { path = "../zou-realtime" }
zou-rest = { path = "../zou-rest" }
zou-store = { path = "../zou-store", features = ["s3"] }

[dev-dependencies]
base64ct = { workspace = true }
env_logger = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tempfile = { workspace = true }
tokio-tungstenite = "0.29"
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
