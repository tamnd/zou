[package]
name = "zou-server"
description = "HTTP front door: Supabase compatible routing, keys, and JWT context"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64ct = { workspace = true }
bcrypt = { version = "0.19", default-features = false, features = ["std", "zeroize"] }
bytes = "1"
# A split websocket is a sink and a stream, which is what sink is for:
# the link to the node holding a tenant writes and reads at once.
futures-util = { version = "0.3", default-features = false, features = [
    "alloc",
    "sink",
] }
getrandom = { workspace = true }
hmac = { workspace = true }
image = { workspace = true }
log = { workspace = true }
md-5 = "0.11"
p256 = { workspace = true }
qrcodegen = "1.8"
rustls = { workspace = true }
serde_json = { workspace = true }
sha1 = "0.11"
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tokio-rustls = { workspace = true }
# The client half of a websocket, for the link from a node with the
# sockets to the node with the tenant. rustls because it is the TLS this
# build already links, rather than a second one for `wss:`.
tokio-tungstenite = { version = "0.30", features = [
    "rustls-tls-webpki-roots",
] }
tower = { workspace = true, features = ["util"] }
ureq = { workspace = true }
webp = { workspace = true }
webpki-roots = { workspace = true }
zou-functions = { path = "../zou-functions" }
zou-json = { path = "../zou-json" }
zou-ops = { path = "../zou-ops" }
zou-realtime = { path = "../zou-realtime" }
zou-rest = { path = "../zou-rest" }
zou-store = { path = "../zou-store", features = ["s3"] }

[dev-dependencies]
base64ct = { workspace = true }
env_logger = { workspace = true }
# A certificate for the tests that speak TLS to the postgres port. Its
# defaults are ring and pem, which is the crypto this build already
# links and the format the door reads, so it brings nothing new with it.
rcgen = "0.14"
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "test-util"] }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
