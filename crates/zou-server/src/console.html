<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>zou console</title>
<style>
:root {
  --bg: #101418; --panel: #161c22; --line: #232c35; --text: #d7dee6;
  --dim: #7d8b99; --accent: #4fb3a5; --bad: #e0674f; --font: ui-monospace,
  SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; height: 100vh; display: flex; flex-direction: column;
  background: var(--bg); color: var(--text); font: 13px/1.5 var(--font);
}
header {
  display: flex; align-items: center; gap: 12px; padding: 8px 12px;
  border-bottom: 1px solid var(--line); background: var(--panel);
}
header b { color: var(--accent); font-weight: 600; }
header input {
  flex: 1; min-width: 0; padding: 5px 8px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 3px; color: var(--text);
  font: inherit;
}
button {
  padding: 5px 12px; background: var(--line); color: var(--text);
  border: 1px solid var(--line); border-radius: 3px; font: inherit;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button[disabled] { opacity: .5; cursor: default; border-color: var(--line); }
main { flex: 1; display: flex; min-height: 0; }
nav {
  width: 260px; flex: none; overflow: auto; padding: 8px 0;
  border-right: 1px solid var(--line); background: var(--panel);
}
nav h2 {
  margin: 10px 0 2px; padding: 0 12px; font-size: 11px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
}
nav button {
  display: block; width: 100%; padding: 2px 12px 2px 22px;
  background: none; border: 0; border-radius: 0; color: var(--text);
  text-align: left; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap;
}
nav button:hover { background: var(--line); }
nav button:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
nav button span { color: var(--dim); }
section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
textarea {
  height: 30%; min-height: 90px; resize: vertical; padding: 10px 12px;
  background: var(--bg); color: var(--text); border: 0;
  border-bottom: 1px solid var(--line); font: inherit; outline: none;
}
#bar {
  display: flex; align-items: center; gap: 12px; padding: 6px 12px;
  border-bottom: 1px solid var(--line); color: var(--dim);
}
#bar input {
  width: 260px; padding: 3px 8px; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 3px; font: inherit;
}
#bar button { padding: 2px 10px; }
#out { flex: 1; overflow: auto; padding: 0 0 40px; }
table { border-collapse: collapse; width: 100%; }
th, td {
  padding: 3px 10px; text-align: left; border-bottom: 1px solid var(--line);
  white-space: pre; max-width: 460px; overflow: hidden;
  text-overflow: ellipsis;
}
th {
  position: sticky; top: 0; background: var(--panel); color: var(--dim);
  font-weight: 600;
}
td button {
  padding: 0; background: none; border: 0; border-radius: 0;
  color: var(--accent); font: inherit; text-align: left;
}
td button:hover { text-decoration: underline; }
td.null { color: var(--dim); font-style: italic; }
td.dim { color: var(--dim); }
td.warn { color: var(--bad); }
p.tag { margin: 8px 12px; color: var(--dim); }
pre.bad {
  margin: 12px; padding: 10px 12px; border-left: 3px solid var(--bad);
  background: var(--panel); color: var(--bad); white-space: pre-wrap;
}
</style>
</head>
<body>
<header>
  <b>zou</b>
  <input id="key" type="password" spellcheck="false"
         placeholder="service role key" autocomplete="off">
  <button id="connect">connect</button>
  <button id="run" disabled>run</button>
</header>
<main>
  <nav id="tree"></nav>
  <section>
    <textarea id="sql" spellcheck="false"
              placeholder="select * from ..."></textarea>
    <div id="bar"></div>
    <div id="out"></div>
  </section>
</main>
<script>
"use strict";
var tree = document.getElementById("tree");
var out = document.getElementById("out");
var bar = document.getElementById("bar");
var sql = document.getElementById("sql");
var keyBox = document.getElementById("key");
var runBtn = document.getElementById("run");
// The one line of status both views write to. It lives outside the bar
// so that redrawing the bar's controls does not take it with them.
var note = document.createElement("span");
bar.appendChild(note);
var term = "";
var page = 0;

// The key lives in this tab and nowhere else. sessionStorage rather
// than localStorage, so closing the tab is logging out, and a second
// project opened in a second tab does not inherit the first one's key.
keyBox.value = sessionStorage.getItem("zou.key") || "";

function ask(path, body) {
  return fetch(path, {
    method: body ? "POST" : "GET",
    headers: {
      "authorization": "Bearer " + keyBox.value,
      "content-type": "application/json"
    },
    body: body ? JSON.stringify(body) : undefined
  }).then(function (r) {
    return r.json().then(function (j) { return { status: r.status, body: j }; });
  });
}

function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

function el(name, text, cls) {
  var n = document.createElement(name);
  if (text !== undefined && text !== null) n.textContent = text;
  if (cls) n.className = cls;
  return n;
}

function complain(text) {
  clear(out);
  out.appendChild(el("pre", text, "bad"));
}

// The bar carries the status line alone, plus whatever controls the
// view that is up needs beside it.
function plainBar() {
  clear(bar);
  bar.appendChild(note);
}

function editing() {
  sql.style.display = "";
  runBtn.style.display = "";
  plainBar();
}

// The other mode. The editor goes away rather than sitting there with
// the run button live over a list that has nothing to do with it.
function listing() {
  sql.style.display = "none";
  runBtn.style.display = "none";
  plainBar();
}

// Paging by a next button and not by a total, because a count over
// every row is a read of the whole table to draw a footer. The list
// asks for one more row than it shows and that is the whole question a
// next button answers.
function pager(more, again) {
  if (page > 0) {
    var back = el("button", "back");
    back.type = "button";
    back.onclick = function () { page -= 1; again(); };
    bar.appendChild(back);
  }
  if (more) {
    var next = el("button", "next");
    next.type = "button";
    next.onclick = function () { page += 1; again(); };
    bar.appendChild(next);
  }
}

// Powers of 1024 under the names that mean powers of 1024. A console
// that printed 1 MB for 1048576 bytes would be one nobody could check
// a file size against.
function bytes(n) {
  if (n === null || n === undefined) return "";
  var units = ["B", "KiB", "MiB", "GiB", "TiB"];
  var i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i += 1; }
  return (i === 0 ? n : n.toFixed(1)) + " " + units[i];
}

function connect() {
  sessionStorage.setItem("zou.key", keyBox.value);
  clear(tree);
  editing();
  note.textContent = "reading the catalog";
  ask("/_zou/api/catalog").then(function (answer) {
    if (answer.status !== 200) {
      note.textContent = "";
      runBtn.disabled = true;
      complain(answer.body.error || ("HTTP " + answer.status));
      return;
    }
    runBtn.disabled = false;
    note.textContent = "";
    draw(answer.body.schemas);
  }, function (e) { complain(String(e)); });
}

function draw(schemas) {
  clear(tree);
  // The people come before the tables, because "who is this and did
  // they ever confirm their email" is the other question this page
  // exists to answer, and answering it in the editor means knowing
  // that auth.users and auth.identities exist and how they join.
  tree.appendChild(el("h2", "project"));
  var people = el("button");
  people.type = "button";
  people.appendChild(document.createTextNode("users"));
  people.onclick = function () { term = ""; page = 0; users(); };
  tree.appendChild(people);
  var files = el("button");
  files.type = "button";
  files.appendChild(document.createTextNode("storage"));
  files.onclick = function () { term = ""; page = 0; buckets(); };
  tree.appendChild(files);
  var trail = el("button");
  trail.type = "button";
  trail.appendChild(document.createTextNode("audit"));
  trail.onclick = function () { term = ""; page = 0; audit(); };
  tree.appendChild(trail);
  var cost = el("button");
  cost.type = "button";
  cost.appendChild(document.createTextNode("usage"));
  cost.onclick = function () { term = ""; page = 0; usage(); };
  tree.appendChild(cost);
  schemas.forEach(function (schema) {
    tree.appendChild(el("h2", schema.name));
    schema.relations.forEach(function (relation) {
      // A button and not a styled link, because clicking it does not
      // go anywhere: it fills the editor and runs. That also gets it
      // into the tab order for free, which a link with no href does
      // not, and a sidebar you cannot reach from the keyboard is a
      // sidebar half the people who open this page cannot use.
      var item = el("button");
      item.type = "button";
      item.appendChild(document.createTextNode(relation.name));
      if (relation.rows !== null) {
        item.appendChild(el("span", "  ~" + Math.round(relation.rows)));
      }
      item.title = relation.columns.map(function (c) {
        return c.name + " " + c.type + (c.required ? " not null" : "")
          + (c.pkey ? " primary key" : "");
      }).join("\n");
      item.onclick = function () {
        editing();
        // Quoted both halves, because a table called "Order" or one
        // with a space in it is a table somebody made and the console
        // has to be able to open it.
        sql.value = 'select * from "' + schema.name.replace(/"/g, '""')
          + '"."' + relation.name.replace(/"/g, '""') + '" limit 100';
        run();
      };
      tree.appendChild(item);
    });
  });
  if (!schemas.length) tree.appendChild(el("h2", "nothing to show"));
}

// The user list, with the search and the paging it needs beside it.
function users() {
  listing();
  var find = el("input");
  find.type = "search";
  find.spellcheck = false;
  find.placeholder = "email, phone or id";
  find.value = term;
  find.onkeydown = function (e) {
    if (e.key === "Enter") { term = find.value.trim(); page = 0; users(); }
  };
  bar.insertBefore(find, note);
  note.textContent = "reading users";
  ask("/_zou/api/users?q=" + encodeURIComponent(term) + "&page=" + page)
    .then(function (answer) {
      if (answer.status !== 200) {
        note.textContent = "";
        complain(answer.body.error || ("HTTP " + answer.status));
        return;
      }
      if (answer.body.absent) {
        note.textContent = "";
        clear(out);
        out.appendChild(el("p", "This project has no auth schema on it, "
          + "so there is nobody to list.", "tag"));
        return;
      }
      showUsers(answer.body);
      pager(answer.body.more, users);
      find.focus();
    }, function (e) { complain(String(e)); });
}

function showUsers(body) {
  clear(out);
  note.textContent = body.users.length + " on page " + (body.page + 1);
  if (!body.users.length) {
    out.appendChild(el("p", term ? "Nobody matches that." : "No users yet.", "tag"));
    return;
  }
  var head = el("tr");
  ["email", "phone", "providers", "state", "last sign in", "created", "id"]
    .forEach(function (name) { head.appendChild(el("th", name)); });
  var table = el("table");
  table.appendChild(head);
  body.users.forEach(function (user) {
    var tr = el("tr");
    tr.appendChild(el("td", user.email || ""));
    tr.appendChild(el("td", user.phone || ""));
    tr.appendChild(el("td", user.providers.join(", ")));
    // One word for the thing somebody came to check. Banned first
    // because it outranks the rest: a banned account that confirmed
    // its email is still an account that cannot sign in.
    if (user.banned) tr.appendChild(el("td", "banned", "warn"));
    else if (user.anonymous) tr.appendChild(el("td", "anonymous", "dim"));
    else if (user.confirmed) tr.appendChild(el("td", "confirmed"));
    else tr.appendChild(el("td", "unconfirmed", "warn"));
    tr.appendChild(el("td", user.last_sign_in_at || "never",
      user.last_sign_in_at ? "" : "dim"));
    tr.appendChild(el("td", user.created_at || ""));
    tr.appendChild(el("td", user.id, "dim"));
    table.appendChild(tr);
  });
  out.appendChild(table);
}

// The buckets, whole. There are never many and the endpoint does not
// page them, so this view has no search and no buttons: the names are
// the links into the file lists and that is all it is for.
function buckets() {
  listing();
  note.textContent = "reading buckets";
  ask("/_zou/api/buckets").then(function (answer) {
    note.textContent = "";
    if (answer.status !== 200) {
      complain(answer.body.error || ("HTTP " + answer.status));
      return;
    }
    clear(out);
    if (answer.body.absent) {
      out.appendChild(el("p", "This project has no storage schema on it, "
        + "so there is nothing to list.", "tag"));
      return;
    }
    var list = answer.body.buckets;
    note.textContent = list.length + (list.length === 1 ? " bucket" : " buckets");
    if (!list.length) {
      out.appendChild(el("p", "No buckets yet.", "tag"));
      return;
    }
    var head = el("tr");
    ["name", "access", "kind", "size limit", "accepts", "created"]
      .forEach(function (name) { head.appendChild(el("th", name)); });
    var table = el("table");
    table.appendChild(head);
    list.forEach(function (b) {
      var tr = el("tr");
      var cell = el("td");
      var open = el("button", b.name);
      open.type = "button";
      open.onclick = function () { term = ""; page = 0; objects(b.id); };
      cell.appendChild(open);
      tr.appendChild(cell);
      // Public is the one worth reading twice: it means every object
      // in it is readable by anybody who knows the url, which is the
      // setting people are surprised by.
      tr.appendChild(el("td", b.public ? "public" : "private",
        b.public ? "warn" : "dim"));
      tr.appendChild(el("td", (b.type || "").toLowerCase(), "dim"));
      // No limit and no list are the defaults, and a default is not a
      // value somebody chose, so both say what they are rather than
      // leaving the column blank.
      tr.appendChild(el("td", b.file_size_limit === null ? "none"
        : bytes(b.file_size_limit), b.file_size_limit === null ? "dim" : ""));
      var kinds = b.allowed_mime_types;
      tr.appendChild(el("td", kinds && kinds.length ? kinds.join(", ") : "anything",
        kinds && kinds.length ? "" : "dim"));
      tr.appendChild(el("td", b.created_at || "", "dim"));
      table.appendChild(tr);
    });
    out.appendChild(table);
  }, function (e) { complain(String(e)); });
}

// One bucket's files, in name order, which is the order a listing of
// files is in everywhere else.
function objects(id) {
  listing();
  var home = el("button", "buckets");
  home.type = "button";
  home.onclick = function () { term = ""; page = 0; buckets(); };
  bar.insertBefore(home, note);
  var find = el("input");
  find.type = "search";
  find.spellcheck = false;
  find.placeholder = "file name";
  find.value = term;
  find.onkeydown = function (e) {
    if (e.key === "Enter") { term = find.value.trim(); page = 0; objects(id); }
  };
  bar.insertBefore(find, note);
  note.textContent = "reading " + id;
  ask("/_zou/api/objects?bucket=" + encodeURIComponent(id)
    + "&q=" + encodeURIComponent(term) + "&page=" + page)
    .then(function (answer) {
      note.textContent = "";
      if (answer.status !== 200) {
        complain(answer.body.error || ("HTTP " + answer.status));
        return;
      }
      clear(out);
      if (answer.body.absent) {
        out.appendChild(el("p", "This project has no storage schema on it, "
          + "so there is nothing to list.", "tag"));
        return;
      }
      var list = answer.body.objects;
      note.textContent = id + ", " + list.length + " on page " + (page + 1);
      if (!list.length) {
        out.appendChild(el("p", term ? "Nothing in this bucket matches that."
          : "This bucket is empty.", "tag"));
      } else {
        var head = el("tr");
        ["name", "size", "type", "updated", "created", "version"]
          .forEach(function (name) { head.appendChild(el("th", name)); });
        var table = el("table");
        table.appendChild(head);
        list.forEach(function (o) {
          var tr = el("tr");
          tr.appendChild(el("td", o.name || ""));
          // A size the metadata does not carry is not a size of zero,
          // and an upload that never finished is exactly the row
          // somebody came here to find.
          tr.appendChild(el("td", o.size === null ? "unknown" : bytes(o.size),
            o.size === null ? "warn" : ""));
          tr.appendChild(el("td", o.mimetype || "", o.mimetype ? "" : "dim"));
          tr.appendChild(el("td", o.updated_at || "", "dim"));
          tr.appendChild(el("td", o.created_at || "", "dim"));
          tr.appendChild(el("td", o.version || "", "dim"));
          table.appendChild(tr);
        });
        out.appendChild(table);
      }
      pager(answer.body.more, function () { objects(id); });
      find.focus();
    }, function (e) { complain(String(e)); });
}

// The audit trail: who did what, from where, and when.
function audit() {
  listing();
  var find = el("input");
  find.type = "search";
  find.spellcheck = false;
  find.placeholder = "action, actor or address";
  find.value = term;
  find.onkeydown = function (e) {
    if (e.key === "Enter") { term = find.value.trim(); page = 0; audit(); }
  };
  bar.insertBefore(find, note);
  note.textContent = "reading the audit trail";
  ask("/_zou/api/audit?q=" + encodeURIComponent(term) + "&page=" + page)
    .then(function (answer) {
      note.textContent = "";
      if (answer.status !== 200) {
        complain(answer.body.error || ("HTTP " + answer.status));
        return;
      }
      clear(out);
      if (answer.body.absent) {
        out.appendChild(el("p", "This project has no auth schema on it, "
          + "so there is no trail to read.", "tag"));
        return;
      }
      var list = answer.body.entries;
      note.textContent = list.length + " on page " + (page + 1);
      if (!list.length) {
        // An empty trail on a project that is not writing one is not
        // a quiet project, and saying so is the difference between
        // reading nothing and reading nothing into it.
        out.appendChild(el("p", answer.body.writing
          ? (term ? "Nothing matches that." : "Nothing has been recorded yet.")
          : "This project does not write its audit trail to postgres, so "
            + "the entries are on the log stream and not in this table.",
          "tag"));
      } else {
        var head = el("tr");
        ["when", "action", "kind", "actor", "address", "traits"]
          .forEach(function (name) { head.appendChild(el("th", name)); });
        var table = el("table");
        table.appendChild(head);
        list.forEach(function (entry) {
          var tr = el("tr");
          tr.appendChild(el("td", entry.at || ""));
          tr.appendChild(el("td", entry.action || ""));
          tr.appendChild(el("td", entry.kind || "", "dim"));
          tr.appendChild(el("td", entry.actor || "", entry.actor ? "" : "dim"));
          tr.appendChild(el("td", entry.ip || "", entry.ip ? "" : "dim"));
          tr.appendChild(el("td", entry.traits || "", "dim"));
          table.appendChild(tr);
        });
        out.appendChild(table);
      }
      pager(answer.body.more, audit);
      find.focus();
    }, function (e) { complain(String(e)); });
}

// A whole number with the separators a person reads. Counters here run
// to the hundreds of millions on a busy project and an unbroken run of
// digits is one nobody can tell from the run of digits above it.
function count(n) {
  if (n === null || n === undefined) return "";
  return Math.round(n).toLocaleString("en-US");
}

// Two columns, a name and a number. Not a th, because neither column is
// a heading of the other: it is a list of facts about one thing.
function fact(table, name, value, cls) {
  var tr = el("tr");
  tr.appendChild(el("td", name, "dim"));
  tr.appendChild(el("td", value, cls));
  table.appendChild(tr);
}

// How large this project is and what has gone through it.
function usage() {
  listing();
  note.textContent = "measuring";
  ask("/_zou/api/usage").then(function (answer) {
    note.textContent = "";
    if (answer.status !== 200) {
      complain(answer.body.error || ("HTTP " + answer.status));
      return;
    }
    clear(out);
    var db = answer.body.database;
    if (db) {
      note.textContent = db.name + ", " + bytes(db.bytes);
      var facts = el("table");
      fact(facts, "database", db.name);
      fact(facts, "on disk", bytes(db.bytes));
      fact(facts, "tables and indexes", bytes(answer.body.relation_bytes)
        + " over " + count(answer.body.relation_count)
        + (answer.body.relation_count === 1 ? " relation" : " relations"));
      fact(facts, "connections", count(db.connections));
      // The one ratio worth printing. Under about 99 percent on a
      // project that fits in memory means it is not in memory, which is
      // the answer to most of the questions that bring somebody here.
      var looked = db.blocks_hit + db.blocks_read;
      if (looked > 0) {
        var share = (db.blocks_hit * 100) / looked;
        fact(facts, "blocks from cache", share.toFixed(1) + " percent, "
          + count(db.blocks_read) + " read from disk",
          share < 90 ? "warn" : "");
      } else {
        fact(facts, "blocks from cache", "nothing read yet", "dim");
      }
      fact(facts, "transactions", count(db.commits) + " committed, "
        + count(db.rollbacks) + " rolled back");
      fact(facts, "rows written", count(db.rows_inserted) + " inserted, "
        + count(db.rows_updated) + " updated, "
        + count(db.rows_deleted) + " deleted");
      fact(facts, "rows read", count(db.rows_fetched) + " fetched of "
        + count(db.rows_returned) + " returned");
      // Any at all is worth the colour. A deadlock is two transactions
      // that could not both go on and one of them was killed for it.
      fact(facts, "deadlocks", count(db.deadlocks),
        db.deadlocks > 0 ? "warn" : "dim");
      fact(facts, "temporary files", bytes(db.temp_bytes),
        db.temp_bytes > 0 ? "" : "dim");
      // A total with no start to it is not a measurement, and on a node
      // that has been up an hour it means something very different than
      // on one that has been up a year.
      fact(facts, "counting since",
        db.counting_since || "the cluster was created",
        db.counting_since ? "" : "dim");
      out.appendChild(facts);
      out.appendChild(el("p", "Sizes are what is on disk now. Everything "
        + "under them is a total since the counters were last reset, so "
        + "the number to read is the difference between two of these.",
        "tag"));
    }
    var list = answer.body.relations;
    if (!list.length) {
      out.appendChild(el("p", "This database has no relations of its own.",
        "tag"));
      return;
    }
    if (answer.body.relation_count > list.length) {
      out.appendChild(el("p", "The " + list.length + " largest of "
        + count(answer.body.relation_count) + ".", "tag"));
    }
    var head = el("tr");
    ["relation", "kind", "rows", "table", "indexes", "total"]
      .forEach(function (name) { head.appendChild(el("th", name)); });
    var table = el("table");
    table.appendChild(head);
    var kinds = { r: "table", m: "materialized view", p: "partitioned" };
    list.forEach(function (r) {
      var tr = el("tr");
      tr.appendChild(el("td", r.schema + "." + r.name));
      tr.appendChild(el("td", kinds[r.kind] || r.kind, "dim"));
      tr.appendChild(el("td", r.rows === null ? "" : "~" + count(r.rows),
        "dim"));
      tr.appendChild(el("td", bytes(r.table_bytes)));
      // A table that is mostly index is one somebody has indexed twice
      // over, which is worth seeing beside the table it indexes rather
      // than folded into one number with it.
      tr.appendChild(el("td", bytes(r.index_bytes),
        r.index_bytes > r.table_bytes ? "warn" : ""));
      tr.appendChild(el("td", bytes(r.total_bytes)));
      table.appendChild(tr);
    });
    out.appendChild(table);
  }, function (e) { complain(String(e)); });
}

function run() {
  var text = sql.value.trim();
  if (!text) return;
  runBtn.disabled = true;
  note.textContent = "running";
  ask("/_zou/api/sql", { query: text }).then(function (answer) {
    runBtn.disabled = false;
    if (answer.status !== 200) {
      note.textContent = "";
      complain(answer.body.error || ("HTTP " + answer.status));
      return;
    }
    if (answer.body.error) {
      note.textContent = "";
      var e = answer.body.error;
      var lines = [e.message];
      if (e.code) lines[0] = e.code + ": " + e.message;
      if (e.detail) lines.push(e.detail);
      if (e.hint) lines.push("hint: " + e.hint);
      if (e.position) lines.push("at character " + e.position);
      complain(lines.join("\n"));
      return;
    }
    note.textContent = answer.body.ms.toFixed(1) + " ms";
    show(answer.body.results);
  }, function (e) { runBtn.disabled = false; complain(String(e)); });
}

function show(results) {
  clear(out);
  results.forEach(function (result) {
    if (!result.columns.length) {
      out.appendChild(el("p", result.touched + " rows", "tag"));
      return;
    }
    var table = el("table");
    var head = el("tr");
    result.columns.forEach(function (name) { head.appendChild(el("th", name)); });
    table.appendChild(head);
    result.rows.forEach(function (row) {
      var tr = el("tr");
      row.forEach(function (cell) {
        if (cell === null) tr.appendChild(el("td", "null", "null"));
        else tr.appendChild(el("td", cell));
      });
      table.appendChild(tr);
    });
    out.appendChild(table);
    out.appendChild(el("p", result.rows.length + " rows", "tag"));
  });
  if (!results.length) out.appendChild(el("p", "no answer", "tag"));
}

document.getElementById("connect").onclick = connect;
runBtn.onclick = run;
// Enter runs on the keyboard people already have in their fingers from
// every other console, and a plain newline is still a plain newline.
sql.onkeydown = function (e) {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); run(); }
};
keyBox.onkeydown = function (e) { if (e.key === "Enter") connect(); };
if (keyBox.value) connect();
</script>
