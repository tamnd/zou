[package]
name = "zou-node"
description = "The Node binding over zou-embed: a Supabase compatible backend inside a node process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
zou-embed = { path = "../zou-embed" }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
