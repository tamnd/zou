[package]
name = "zou-deno"
description = "A javascript isolate that runs an edge function, behind a feature so nothing pays for V8 unless it asked for it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Off by default, and that is the whole point of this crate existing
# separately. With the feature off it compiles to nothing in about a
# second, so `cargo test --workspace` on a machine that only cares about
# the database never downloads V8 or builds swc.
default = []
isolate = ["dep:aes", "dep:aes-gcm", "dep:base64ct", "dep:cbc", "dep:deno_ast", "dep:deno_core", "dep:deno_error", "dep:flate2", "dep:futures-util", "dep:getrandom", "dep:hmac", "dep:log", "dep:p256", "dep:rustls", "dep:serde", "dep:serde_json", "dep:sha1", "dep:sha2", "dep:tokio", "dep:tokio-rustls", "dep:tokio-tungstenite", "dep:ureq", "dep:webpki-roots"]

[dependencies]
zou-functions = { path = "../zou-functions" }
# `crypto.subtle.encrypt` and its other half. A session cookie is the
# thing in this corpus that asks, and what it asks for is AES-CBC with
# an iv it hands in.
aes = { workspace = true, optional = true }
# The `sha512-` in a package's integrity is base64, and this is the
# base64 the rest of the workspace reads.
base64ct = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
cbc = { workspace = true, optional = true }
deno_ast = { version = "0.53", features = ["transpiling"], optional = true }
deno_core = { version = "0.410", optional = true }
deno_error = { version = "0.7", optional = true }
# What a package arrives inside of. The tar underneath the gzip is read
# in this crate, since a package needs the reading of tar and none of
# the ownership, permissions or links the format also carries.
flate2 = { workspace = true, optional = true }
# `crypto.getRandomValues`, from the operating system and not from here.
getrandom = { workspace = true, optional = true }
# The same signing the server does for its own tokens, reached through
# `crypto.subtle` instead.
hmac = { workspace = true, optional = true }
# An import map entry that the specification throws away is worth a
# line in the log rather than silence, and the facade is what the
# binary above this already installs a logger for.
log = { workspace = true, optional = true }
# The one asymmetric algorithm `crypto.subtle` here has: ECDSA on
# P-256, which is what a function verifying an access token against a
# project's published keys checks a signature with. The same crate the
# server verifies those tokens with, so both ends agree on what a
# signature is.
p256 = { workspace = true, optional = true }
# `Deno.startTls` and `Deno.connectTls`, which is the same TLS the rest
# of this build already links rather than a second stack for a socket.
rustls = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
# An import map is json, and a `deno.jsonc` is json with the comments
# taken out first. Already in the tree underneath deno_core.
# `preserve_order`, because the order of the conditions in a package's
# `exports` is what decides which build runs and a map that sorts its
# keys would quietly pick `default` over `deno` every time. It is
# already on in this tree through another crate, and naming it here is
# the difference between that being true and that being relied on.
serde_json = { workspace = true, features = ["preserve_order"], optional = true }
# `crypto.subtle.digest` has four hashes and this is the one of them
# that is not sha2. It is already in the tree.
sha1 = { workspace = true, optional = true }
# A url is not a file name, so a cached module is named for its digest,
# and `crypto.subtle.digest` is three of its four hashes.
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
# The asynchronous half of that, for a socket a function holds. Already
# in the tree underneath the websocket client, and named here with the
# ring provider so nothing pulls a second one in.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
], optional = true }
# The client half of a websocket, which the server side of this
# repository already speaks through the same crate. rustls because it
# is the TLS this build already links for `fetch` and the module
# loader, rather than a second one for `wss:`.
tokio-tungstenite = { version = "0.30", features = [
    "rustls-tls-webpki-roots",
], optional = true }
# The same client zou-server calls a webhook with, rather than the
# hyper and second TLS stack deno_fetch would bring.
ureq = { workspace = true, optional = true }
# What a certificate is checked against, which is the bundle everything
# else on the machine trusts too.
webpki-roots = { workspace = true, optional = true }
# A split websocket is a sink and a stream, which is what these are for.
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
], optional = true }

[dev-dependencies]
# The cached module test names a file the way the loader names it.
sha2 = { workspace = true }
# The server side of a socket test: one thread with a listener in it,
# and for the TLS half the same rustls the client half is built on.
rustls = { workspace = true }
# The other end of a websocket, for the test server the socket tests
# talk to. Synchronous, because that server is a thread with a loop in
# it the same way the http one beside it is, and it is the same crate
# the client half is built on rather than a second implementation.
tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
] }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
