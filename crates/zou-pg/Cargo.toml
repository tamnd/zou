[package]
name = "zou-pg"
description = "C ABI shim between the Postgres zou storage manager and zou-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# staticlib links into the postgres backend, rlib keeps cargo test working.
crate-type = ["staticlib", "rlib"]

[dependencies]
# The s3 feature so ZOU_TARGET can name an object store URL, which links
# the S3 client into the postgres backend through the staticlib.
zou-store = { path = "../zou-store", features = ["s3"] }
crc32c = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
