[package]
name = "zou-realtime"
description = "The Phoenix channel protocol realtime-js speaks, and the fan out behind it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
zou-json = { path = "../zou-json" }

[dev-dependencies]
# The shipped binary has `raw_value` on, because `axum` turns it on,
# and that is what makes a private key in a payload dangerous. Testing
# this crate on its own resolves without it, so the round trip test
# would pass on a build the bug cannot happen on.
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
